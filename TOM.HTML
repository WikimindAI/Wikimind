<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #000000;
  --bg2: #0a0a0a;
  --bg3: #141414;
  --bg4: #1e1e1e;
  --border: rgba(255, 255, 255, 0.1);

}

html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', sans-serif;

/* ========== SIDEBAR ========== */
#sidebar-overlay {
  position: fixed;
  inset: 0;
  z-index: 299;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
#sidebar-overlay.active { opacity: 1; pointer-events: all; }

#sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 268px;
  z-index: 300;
  background: #0d0d0d;
  border-right: 1px solid rgba(255,255,255,0.07);

  flex-direction: column;

  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 12px 10px;
  flex-shrink: 0;
}

}
#sidebar-head-right {

  align-items: center;

}
#search-sidebar-btn, #close-sidebar {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--text2);

  align-items: center;
  justify-content: center;

/* SEARCH BAR */

}
#sidebar-search-wrap.visible { display: block; }
#sidebar-search {

/* ACTION BUTTONS */
.sidebar-actions {

.sidebar-action-btn {

/* Dropdown contextuel du conv-item */
.conv-ctx-menu {

.conv-ctx-item.danger { color: #f87171; }
.conv-ctx-item.danger:hover { background: rgba(248,113,113,0.08); }

/* RENAME INPUT */
.conv-rename-input {

/* SIDEBAR FOOT */
#sidebar-foot {

}
.s-user-row {

/* PROFILE POPUP MENU */
#profile-popup {
  position: fixed;
  bottom: 70px;
  left: 12px;
  width: 244px;
  background: #161616;
  border: 1px solid rgba(255,255,255,0.12);

@keyframes popupIn {

.pp-header {

/* ========== LAYOUT ========== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  position: relative;
}

/* â”€â”€ Lueur radiale grise sur l'Ã©cran d'accueil (faÃ§on Gemini, en gris) â”€â”€ */
#bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 55% 50% at 50% 55%, rgba(180,180,190,0.32) 0%, rgba(140,140,150,0.14) 40%, transparent 70%);
  opacity: 0;
  transform-origin: 50% 100%;
  transform: scale(1) translateY(0);
  border-radius: 42% 58% 63% 37% / 45% 38% 62% 55%;
  filter: blur(0px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.4,0,0.2,1), filter 0.7s ease;
  animation: bgGlowMorph 16s ease-in-out infinite;
}
/* La forme n'est jamais un ellipse parfaite : elle respire lentement entre plusieurs blobs organiques */
@keyframes bgGlowMorph {
  0%   { border-radius: 42% 58% 63% 37% / 45% 38% 62% 55%; }
  25%  { border-radius: 58% 42% 45% 55% / 55% 60% 40% 45%; }
  50%  { border-radius: 50% 50% 38% 62% / 40% 55% 45% 60%; }
  75%  { border-radius: 63% 37% 55% 45% / 58% 42% 55% 42%; }
  100% { border-radius: 42% 58% 63% 37% / 45% 38% 62% 55%; }
}
body.chat-empty-state #bg-glow {
  opacity: 1;
  transform: scale(1) translateY(0);
}
/* En conversation : le blob glisse et rÃ©trÃ©cit vers le bas pour devenir une lueur
   ambiante juste derriÃ¨re la barre, au lieu de simplement disparaÃ®tre. */
body:not(.chat-empty-state) #bg-glow {
  opacity: 0.55;
  transform: scale(0.22) translateY(6%);
  filter: blur(6px);
}
/* Lueur persistante qui reste collÃ©e Ã  la barre une fois en conversation */
#input-zone { position: relative; }
#input-zone::before {
  content: "";
  position: absolute;
  inset: -36px -12px -12px;
  z-index: -1;
  border-radius: 40px;
  background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(180,180,190,0.16) 0%, transparent 72%);
  opacity: 0;
  transform: scale(1) translateY(0);
  transform-origin: 50% 100%;
  transition: opacity 0.7s ease;
  pointer-events: none;
}
/* Vague declenchee a chaque frappe dans le champ : la lueur respire
   un instant, comme une onde qui part de la barre. Seuls transform et
   opacity sont animes (compositing GPU, aucun repaint de layout). */
#input-zone.wave::before {
  animation: inputZoneWave 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes inputZoneWave {
  0%   { transform: scale(1) translateY(0); opacity: 1; }
  30%  { transform: scale(1.045) translateY(-4px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
body:not(.chat-empty-state) #input-zone::before {
  opacity: 1;
}
#topbar, #chat-wrap {
  position: relative;
  z-index: 1;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;

}

#burger {

/* ========== CHAT AREA ========== */
#chat-wrap {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#chat-area {
  flex: 1;

}

/* ========== WELCOME SCREEN â€” FIX POSITION ========== */
#welcome-screen {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;

  transition: opacity 0.4s ease;
  pointer-events: none;
  /* On monte lÃ©gÃ¨rement pour compenser la zone d'input */
  margin-top: -48px;
}

body:not(.chat-empty-state) #welcome-screen {
  opacity: 0;
  pointer-events: none;
}

#welcome-title {
  font-size: clamp(3rem, 12vw, 6rem);
  font-weight: 900;

  color: var(--text);
  line-height: 1;
  margin-bottom: 0;
  font-style: normal;
  text-shadow: none;
  text-align: center;
}

/* Un mot = bloc insécable, pour que le wrap se fasse aux espaces
   et pas au milieu d'un mot pendant l'animation lettre par lettre */
#welcome-title .wt-word {
  display: inline-block;
  white-space: nowrap;
}

/* Chaque lettre est animée individuellement à l'arrivée sur la page */
#welcome-title .wt-letter {
  display: inline-block;
  transform-origin: 50% 100%;
  opacity: 0;
  animation: wtLetterIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: calc(var(--i) * 45ms);
}
@keyframes wtLetterIn {
  from { opacity: 0; transform: translateY(18px) scale(0.9); filter: blur(4px); }
  to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

/* ========== MESSAGES ========== */
#messages {
  display: flex;

  gap: 0;

}

.msg-group {

}

/* ========== MSG ACTIONS BAR ========== */
.msg-actions {
  display: flex;

  gap: 2px;

}

.act-btn {

/* â”€â”€ Actions pour messages utilisateur â”€â”€ */
.msg-actions.user {

/* â”€â”€ Popup d'avertissement de modÃ©ration â”€â”€ */

/* â”€â”€ WM Image Animation â”€â”€ */
.wm-img-anim-wrap {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  background: #060606;
}
.wm-anim-layer {
  position: absolute;
  inset: -50%;
  width: 200%;
  height: 200%;
  will-change: transform;
}
.wm-anim-l1 {
  background: conic-gradient(from 0deg at 30% 35%, #000 0%, #111 12%, #555 24%, #fff 36%, #1a1a1a 50%, #080808 62%, #888 76%, #3a3a3a 88%, #000 100%);
  filter: blur(40px);
  animation: wmDrift1 6s ease-in-out infinite alternate;
}
.wm-anim-l2 {
  background: conic-gradient(from 120deg at 68% 58%, #0a0a0a 0%, #eee 16%, #1c1c1c 32%, #c8b8d0 48%, #030303 63%, #4a3a52 78%, #0a0a0a 100%);
  filter: blur(46px);
  opacity: 0.8;
  animation: wmDrift2 8s ease-in-out infinite alternate;
}
.wm-anim-l3 {
  background: radial-gradient(ellipse 75% 45% at 55% 35%, rgba(220,210,235,0.6) 0%, transparent 65%),
              radial-gradient(ellipse 45% 70% at 20% 75%, rgba(200,225,215,0.4) 0%, transparent 60%),
              radial-gradient(ellipse 60% 40% at 80% 65%, rgba(180,180,200,0.45) 0%, transparent 70%);
  filter: blur(28px);
  animation: wmDrift3 5s ease-in-out infinite alternate;
}
.wm-anim-l4 {
  background: conic-gradient(from 200deg at 50% 50%, #d0c8e0 0%, #050505 22%, #b0c0d0 44%, #000 66%, #e0d8e8 88%, #050505 100%);
  filter: blur(55px);
  opacity: 0.4;
  animation: wmDrift4 9s ease-in-out infinite alternate;
}
.wm-anim-l5 {
  background: radial-gradient(ellipse 50% 60% at 70% 30%, rgba(160,180,210,0.35) 0%, transparent 70%),
              radial-gradient(ellipse 65% 40% at 25% 55%, rgba(190,170,200,0.3) 0%, transparent 65%);
  filter: blur(35px);
  animation: wmDrift5 7s ease-in-out infinite alternate;
}
@keyframes wmDrift1 {
  0%   { transform: translate(0%, 0%) skew(0deg, 3deg) scale(1); }
  20%  { transform: translate(12%, -9%) skew(5deg, -2deg) scale(1.06); }
  50%  { transform: translate(-10%, 13%) skew(-4deg, 5deg) scale(0.92); }
  75%  { transform: translate(8%, 6%) skew(2deg, -4deg) scale(1.1); }
  100% { transform: translate(-14%, -7%) skew(-6deg, 2deg) scale(0.96); }
}
@keyframes wmDrift2 {
  0%   { transform: translate(0%, 0%) skew(-2deg, 0deg) scale(1); }
  25%  { transform: translate(-13%, 10%) skew(4deg, 3deg) scale(1.08); }
  55%  { transform: translate(11%, -14%) skew(-5deg, 2deg) scale(0.9); }
  80%  { transform: translate(-6%, 8%) skew(3deg, -5deg) scale(1.12); }
  100% { transform: translate(15%, -5%) skew(-2deg, 4deg) scale(0.94); }
}
@keyframes wmDrift3 {
  0%   { transform: translate(0%, 0%) scale(1) rotate(0deg); }
  30%  { transform: translate(14%, -10%) scale(1.12) rotate(4deg); }
  65%  { transform: translate(-12%, 15%) scale(0.88) rotate(-5deg); }
  100% { transform: translate(9%, -12%) scale(1.08) rotate(3deg); }
}
@keyframes wmDrift4 {
  0%   { transform: translate(0%, 0%) rotate(0deg); }
  40%  { transform: translate(-10%, 12%) rotate(18deg); }
  70%  { transform: translate(13%, -8%) rotate(-12deg); }
  100% { transform: translate(-7%, 10%) rotate(22deg); }
}
@keyframes wmDrift5 {
  0%   { transform: translate(0%, 0%) skew(2deg, -1deg) scale(1); }
  35%  { transform: translate(10%, 11%) skew(-3deg, 4deg) scale(1.07); }
  70%  { transform: translate(-9%, -7%) skew(4deg, -3deg) scale(0.93); }
  100% { transform: translate(6%, 13%) skew(-2deg, 2deg) scale(1.04); }
}

  top: 16px;
  left: 16px;
  right: 16px;

  color: var(--text3);
  font-family: 'Geist', sans-serif;
  font-size: 0.95rem;
  line-height: 1.6;

/* ========== MODEL SELECTOR ========== */
#bubble-model-wrap {
  position: static;
}
#bubble-model-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 18px 5px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-family: 'Geist', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  letter-spacing: 0.03em;
}
#bubble-model-btn:hover {
  background: var(--bg3);
  border-color: var(--border2);
  color: var(--text);
}
#bubble-model-btn::after {
  content: '';
  position: absolute;
  right: 7px; top: 50%;
  width: 0; height: 0;
  border-left: 3px solid transparent;
  border-right: 3px solid transparent;
  border-top: 4px solid currentColor;
  transform: translateY(-50%);
  pointer-events: none;
  opacity: 0.4;
  transition: transform 0.2s;
}
#bubble-model-btn.open::after {
  transform: translateY(-50%) rotate(180deg);
}
#bubble-model-btn.model-switched {
  animation: modelSwitchPulse 0.4s ease;
}
@keyframes modelSwitchPulse {
  0% { border-color: var(--border2); }
  35% { border-color: rgba(74, 222, 128, 0.55); background: rgba(74, 222, 128, 0.07); }
  100% { border-color: var(--border2); background: transparent; }
}

/* â”€â”€ Animation message d'erreur modÃ¨le : signal qui pulse, faÃ§on radar perdu â”€â”€ */
@media (prefers-reduced-motion: no-preference) {
  .wm-err-pulse-ring {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(248,113,113,0.18);
    animation: wm-err-pulse 1.8s ease-out infinite;
  }
  .wm-err-switch-arrow {
    animation: wm-err-arrow-nudge 1.6s ease-in-out infinite;
  }
}
.wm-err-pulse-ring {
  position: absolute;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(248,113,113,0.18);
}
@keyframes wm-err-pulse {
  0%   { transform: scale(0.6); opacity: 0.9; }
  70%  { transform: scale(1.6); opacity: 0; }
  100% { transform: scale(1.6); opacity: 0; }
}
@keyframes wm-err-arrow-nudge {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(3px); }
}

<script>
(() => {
  'use strict';

  // ============================================================
  // CONFIG
  // ============================================================
  const MISTRAL_KEY      = '7gNv3I9CPqSnSishPV34gHyCSVNmxRUc';
  const POLLINATIONS_KEY = 'pk_w6wnuGBObh7FeHwp';

  const MISTRAL_URL      = 'https://api.mistral.ai/v1/chat/completions';
  const POLLINATIONS_URL = 'https://image.pollinations.ai/prompt/';

  // Modèles Mistral utilisés selon la tâche choisie par le routeur
  const MODELS = {
    router: 'mistral-small-latest',   // classifie chaque requête
    small:  'mistral-small-latest',   // tâches courtes / du quotidien
    large:  'mistral-large-latest',   // tâches complexes / raisonnement
    vision: 'pixtral-large-latest'    // requêtes avec image jointe
  };

  const IMAGE_MODEL = 'gptimage'; // GPT Image 1 Mini via Pollinations

  // Effet d'affichage : la file de caractères reçus pendant une
  // fenêtre est "vidée" lettre par lettre pendant la fenêtre suivante,
  // au lieu d'un affichage brut par bloc (anti bug Mistral sur long stream).
  const REVEAL_WINDOW_MS = 150;
  const REVEAL_TICK_MS   = 20;

  // ============================================================
  // ÉTAT
  // ============================================================
  const state = {
    history: [],      // [{role:'user'|'assistant', content:'...'}]
    attachedImage: null // {dataUrl, base64} si l'utilisateur joint une image
  };

  const $messages  = document.getElementById('messages');
  const $input     = document.getElementById('chat-input');
  const $sendBtn    = document.getElementById('send-btn');
  const $inputZone = document.getElementById('input-zone');

  // ============================================================
  // UTILITAIRES UI
  // ============================================================
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function lightMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  function scrollToBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  // Structure calquée sur Wikimind_AI (.msg-group > .msg-inner > .bubble)
  // pour hériter des animations d'entrée (glissement + flou + fade).
  function addUserBubble(text) {
    const group = document.createElement('div');
    group.className = 'msg-group user';
    group.innerHTML = `<div class="msg-inner"><div class="bubble user">${lightMarkdown(text)}</div></div>`;
    $messages.appendChild(group);
    scrollToBottom();
    return group;
  }

  function addAssistantBubble() {
    const group = document.createElement('div');
    group.className = 'msg-group ai';
    group.innerHTML = `<div class="msg-inner"><div class="bubble ai"><span class="msg-text"></span><span class="msg-cursor">▍</span></div></div>`;
    $messages.appendChild(group);
    scrollToBottom();
    return group;
  }

  function formatTime(date) {
    return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  // Ajoute la barre d'actions (copier / régénérer / heure) sous une
  // bulle assistant, une fois sa réponse terminée.
  function attachMessageActions(group, text, userText) {
    const inner = group.querySelector('.msg-inner');
    if (!inner) return;
    // Évite les doublons si la fonction est appelée deux fois sur le même groupe
    const existing = inner.querySelector('.msg-actions');
    if (existing) existing.remove();

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML = `
      <button class="msg-act-btn msg-act-copy" title="Copier" aria-label="Copier la réponse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
        </svg>
      </button>
      <button class="msg-act-btn msg-act-regen" title="Régénérer la réponse" aria-label="Régénérer la réponse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
      <span class="msg-act-time">${formatTime(new Date())}</span>
    `;
    inner.appendChild(actions);

    const $copyBtn = actions.querySelector('.msg-act-copy');
    const $regenBtn = actions.querySelector('.msg-act-regen');

    $copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // Fallback si l'API clipboard est indisponible (contexte non sécurisé, etc.)
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove();
      }
      const originalSvg = $copyBtn.innerHTML;
      $copyBtn.classList.add('msg-act-copied');
      $copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      setTimeout(() => {
        $copyBtn.classList.remove('msg-act-copied');
        $copyBtn.innerHTML = originalSvg;
      }, 1500);
    });

    if (userText) {
      $regenBtn.addEventListener('click', () => {
        $regenBtn.classList.add('msg-act-spin');
        setTimeout(() => $regenBtn.classList.remove('msg-act-spin'), 650);
        regenerate(userText, group);
      });
    } else {
      $regenBtn.disabled = true;
      $regenBtn.style.opacity = '0.35';
      $regenBtn.style.cursor = 'default';
    }
  }

  function addImageBubble(url, prompt) {
    const group = document.createElement('div');
    group.className = 'msg-group ai';
    group.innerHTML = `<div class="msg-inner"><div class="bubble ai msg-image">
        <img src="${url}" alt="${escapeHtml(prompt)}" loading="lazy">
      </div></div>`;
    $messages.appendChild(group);
    scrollToBottom();
    return group;
  }

  // Indicateur "en train de réfléchir" — 3 points animés, remplace le
  // texte de statut brut qui ne donnait aucun retour visuel convaincant.
  function addThinkingBubble(label) {
    const group = document.createElement('div');
    group.className = 'msg-group ai';
    group.innerHTML = `<div class="msg-inner"><div class="thinking-bubble">
        <span class="thinking-dots"><span class="td-wrap">
          <span class="td td1"></span><span class="td td2"></span><span class="td td3"></span>
        </span></span>
        <span class="thinking-step-label">${escapeHtml(label)}</span>
      </div></div>`;
    $messages.appendChild(group);
    scrollToBottom();
    return {
      setLabel(text) { group.querySelector('.thinking-step-label').textContent = text; },
      remove() { group.remove(); }
    };
  }

  // ============================================================
  // MOTEUR DE RÉVÉLATION FLUIDE (anti-jump, anti-bug stream long)
  // ============================================================
  function createRevealer(targetEl, cursorEl) {
    let queue = [];
    let raw = '';
    let ticker = null;

    function start() {
      if (ticker) return;
      ticker = setInterval(() => {
        if (queue.length === 0) return;
        // on vide la file accumulée sur la fenêtre précédente,
        // répartie lettre par lettre sur la fenêtre en cours
        const ticksPerWindow = Math.max(1, Math.round(REVEAL_WINDOW_MS / REVEAL_TICK_MS));
        const charsThisTick = Math.max(1, Math.ceil(queue.length / ticksPerWindow));
        const chunk = queue.splice(0, charsThisTick).join('');
        raw += chunk;
        targetEl.innerHTML = lightMarkdown(raw);
        scrollToBottom();
      }, REVEAL_TICK_MS);
    }

    // Le curseur ne doit JAMAIS rester affiché indéfiniment : on le
    // retire systématiquement, que la génération réussisse ou échoue.
    // C'était la cause du "ça reste, ça bouge plus" — la bulle assistant
    // restait affichée avec son curseur clignotant sans jamais être nettoyée.
    function stopAndCleanCursor() {
      if (ticker) { clearInterval(ticker); ticker = null; }
      if (cursorEl) cursorEl.remove();
    }

    return {
      push(text) {
        queue.push(...text.split(''));
        start();
      },
      finish() {
        return new Promise(resolve => {
          const check = setInterval(() => {
            if (queue.length === 0) {
              clearInterval(check);
              stopAndCleanCursor();
              targetEl.innerHTML = lightMarkdown(raw);
              resolve(raw);
            }
          }, REVEAL_TICK_MS);
        });
      },
      abort(errorText) {
        stopAndCleanCursor();
        targetEl.innerHTML = raw
          ? lightMarkdown(raw) + `<br><em class="msg-error-inline">${escapeHtml(errorText)}</em>`
          : `<em class="msg-error-inline">${escapeHtml(errorText)}</em>`;
      },
      // Arrêt volontaire (bouton stop) : on garde le texte déjà reçu,
      // sans afficher de message d'erreur — ce n'est pas un échec.
      stopEarly() {
        if (queue.length) { raw += queue.join(''); queue = []; }
        stopAndCleanCursor();
        targetEl.innerHTML = lightMarkdown(raw);
        return raw;
      },
      getRaw() { return raw; }
    };
  }

  // ============================================================
  // ROUTEUR — mistral-small choisit le modèle + détecte l'image
  // ============================================================
  async function routeRequest(userText, signal) {
    const systemPrompt = `Tu es un routeur interne. Analyse la requête utilisateur et réponds UNIQUEMENT en JSON strict, sans texte autour, sans balises markdown, au format exact :
{"model":"small|large|vision","image":true|false,"imagePrompt":"prompt anglais optimisé si image sinon vide"}

Règles :
- "vision" si l'utilisateur a joint une image ou demande d'analyser une image.
- "large" si la tâche est complexe, demande du raisonnement poussé, des connaissances pointues, du code long, une analyse approfondie.
- "small" pour toute tâche courte, conversationnelle ou du quotidien.
- "image": true si l'utilisateur demande explicitement de générer/créer/dessiner une image, illustration, logo, photo, etc.
- "imagePrompt": si image=true, écris un prompt de génération d'image en anglais, précis et descriptif, basé sur la demande.`;

    const hasImage = !!state.attachedImage;

    try {
      const res = await fetch(MISTRAL_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${MISTRAL_KEY}`
        },
        body: JSON.stringify({
          model: MODELS.router,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: (hasImage ? '[Une image est jointe] ' : '') + userText }
          ],
          temperature: 0.1,
          response_format: { type: 'json_object' }
        }),
        signal
      });
      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content || '{}';
      const cleaned = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);
      return {
        model: hasImage ? 'vision' : (['small', 'large', 'vision'].includes(parsed.model) ? parsed.model : 'small'),
        image: !!parsed.image,
        imagePrompt: parsed.imagePrompt || userText
      };
    } catch (e) {
      // Une génération stoppée par l'utilisateur doit remonter comme telle,
      // pas être avalée par le fallback "small" ci-dessous.
      if (e.name === 'AbortError') throw e;
      console.error('Erreur routeur, fallback small :', e);
      return { model: hasImage ? 'vision' : 'small', image: false, imagePrompt: userText };
    }
  }

  // ============================================================
  // GÉNÉRATION D'IMAGE — Pollinations / GPT Image 1 Mini
  // ============================================================
  async function generateImage(prompt) {
    const url = `${POLLINATIONS_URL}${encodeURIComponent(prompt)}?model=${IMAGE_MODEL}&token=${POLLINATIONS_KEY}&nologo=true&width=1024&height=1024&seed=${Date.now()}`;
    return url; // l'endpoint Pollinations renvoie directement l'image binaire, on l'utilise en src <img>
  }

  // ============================================================
  // APPEL CHAT STREAMING (Mistral)
  // ============================================================
  async function streamChat(modelKey, revealer, signal) {
    const model = MODELS[modelKey];
    const messages = [
      { role: 'system', content: 'Tu es Wikimind, un assistant IA francophone, clair, précis et utile.' },
      ...state.history
    ];

    const res = await fetch(MISTRAL_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${MISTRAL_KEY}`
      },
      body: JSON.stringify({
        model,
        messages,
        stream: true,
        temperature: 0.7
      }),
      signal
    });

    if (!res.ok || !res.body) {
      throw new Error(`Requête Mistral échouée (${res.status})`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // dernière ligne potentiellement incomplète

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) revealer.push(delta);
        } catch (_) { /* chunk partiel, on ignore */ }
      }
    }

    return revealer.finish();
  }

  // ============================================================
  // ORCHESTRATION PRINCIPALE
  // ============================================================
  let isSending = false;
  let activeController = null; // AbortController de la génération en cours (pour le bouton stop)

  const SEND_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`;
  const STOP_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>`;

  function setSendBtnState(mode) {
    if (mode === 'sending') {
      $sendBtn.classList.add('sending', 'stop-mode');
      $sendBtn.innerHTML = STOP_ICON;
      $sendBtn.title = 'Arrêter la génération';
      $sendBtn.disabled = false; // reste cliquable : c'est le bouton stop
    } else {
      $sendBtn.classList.remove('sending', 'stop-mode');
      $sendBtn.innerHTML = SEND_ICON;
      $sendBtn.title = 'Envoyer';
      $sendBtn.disabled = false;
    }
  }

  // Cœur de la génération : appelle le routeur puis le modèle (texte ou
  // image) pour un message utilisateur donné. Partagé entre l'envoi
  // normal et la régénération.
  async function runAssistantTurn(userText) {
    const thinking = addThinkingBubble('Sélection du modèle...');
    let activeRevealer = null;
    let group = null;
    activeController = new AbortController();

    try {
      const route = await routeRequest(userText, activeController.signal);

      if (route.image) {
        thinking.setLabel('Génération de l\'image...');
        const imgUrl = await generateImage(route.imagePrompt);
        thinking.remove();
        addImageBubble(imgUrl, route.imagePrompt);
        state.history.push({ role: 'assistant', content: `[Image générée : ${route.imagePrompt}]` });
      } else {
        thinking.remove();
        group = addAssistantBubble();
        const target = group.querySelector('.msg-text');
        const cursor = group.querySelector('.msg-cursor');
        activeRevealer = createRevealer(target, cursor);
        const fullText = await streamChat(route.model, activeRevealer, activeController.signal);
        state.history.push({ role: 'assistant', content: fullText });
        attachMessageActions(group, fullText, userText);
      }
    } catch (err) {
      thinking.remove();
      if (err.name === 'AbortError') {
        // Arrêt volontaire via le bouton stop : on garde ce qui a déjà
        // été généré, pas de message d'erreur.
        if (activeRevealer && group) {
          const finalText = activeRevealer.stopEarly();
          state.history.push({ role: 'assistant', content: finalText });
          attachMessageActions(group, finalText, userText);
        }
      } else {
        console.error(err);
        // Si une bulle assistant était déjà en cours d'écriture, on la nettoie
        // et on affiche l'erreur DEDANS plutôt que de laisser un curseur
        // fantôme clignoter indéfiniment et d'empiler une bulle en plus.
        if (activeRevealer) {
          activeRevealer.abort(err.message || String(err));
        } else {
          const g = addAssistantBubble();
          const target = g.querySelector('.msg-text');
          const cursor = g.querySelector('.msg-cursor');
          cursor.remove();
          target.innerHTML = `<em class="msg-error-inline">Une erreur est survenue : ${escapeHtml(err.message || String(err))}</em>`;
        }
      }
    } finally {
      // Toujours réactiver l'envoi, quoi qu'il arrive — c'est la garantie
      // que l'interface ne reste jamais bloquée après un message.
      isSending = false;
      activeController = null;
      setSendBtnState('idle');
      $input.focus();
    }
  }

  async function handleSend() {
    if (isSending) return; // évite le double-envoi (autre cause de blocage perçu)
    const text = $input.value.trim();
    if (!text) return;

    isSending = true;
    setSendBtnState('sending');

    // Bascule du mode "page d'accueil centrée" (logo WIKIMIND + input au
    // milieu) vers le mode conversation normale (input en bas, messages
    // qui défilent). Sans ça, le CSS `.chat-empty-state` reste actif et
    // les messages s'empilent en haut, par-dessus le logo — c'est le bug.
    document.body.classList.remove('chat-empty-state');

    $input.value = '';
    $input.style.height = 'auto';
    addUserBubble(text);
    state.history.push({ role: 'user', content: text });

    await runAssistantTurn(text);
  }

  // Relance une réponse pour un message utilisateur déjà envoyé : on
  // retire la dernière réponse assistant de l'historique (elle va être
  // remplacée) et on refait tourner le même pipeline.
  async function regenerate(userText, group) {
    if (isSending) return;
    isSending = true;
    setSendBtnState('sending');

    if (group) group.remove();
    if (state.history.length && state.history[state.history.length - 1].role === 'assistant') {
      state.history.pop();
    }

    await runAssistantTurn(userText);
  }

  // ============================================================
  // ÉVÉNEMENTS
  // ============================================================
  $sendBtn.addEventListener('click', () => {
    if ($sendBtn.classList.contains('stop-mode')) {
      if (activeController) activeController.abort();
    } else {
      handleSend();
    }
  });
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  // Effet "vague" : la lueur sous la barre pulse légèrement à chaque
  // frappe. Throttlé à ~45ms et limité à transform/opacity (compositing
  // GPU pur, aucun reflow/repaint) pour un coût quasi nul même en frappe
  // rapide ou pendant un collage de texte.
  let lastWaveAt = 0;
  function triggerInputWave() {
    if (document.body.classList.contains('chat-empty-state')) return;
    const now = performance.now();
    if (now - lastWaveAt < 45) return;
    lastWaveAt = now;
    $inputZone.classList.remove('wave');
    void $inputZone.offsetWidth; // force le reflow pour pouvoir relancer l'animation CSS
    $inputZone.classList.add('wave');
  }

  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
    triggerInputWave();
  });

  // ============================================================
  // ANIMATION D'ENTRÉE — lettres du logo WIKIMIND, puis morph
  // travaillé (lettre par lettre) en phrase d'accroche après 1s
  // ============================================================
  (function initWelcomeTitle() {
    const $title = document.getElementById('welcome-title');
    if (!$title) return;
    const baseText = $title.textContent.trim(); // "WIKIMIND"

    // Construit des spans .wt-word > .wt-letter pour animer chaque
    // lettre individuellement à l'arrivée sur la page.
    $title.innerHTML = '';
    const words = baseText.split(' ');
    let i = 0;
    words.forEach((word, wi) => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'wt-word';
      [...word].forEach((ch) => {
        const letter = document.createElement('span');
        letter.className = 'wt-letter';
        letter.style.setProperty('--i', i);
        letter.textContent = ch;
        wordSpan.appendChild(letter);
        i++;
      });
      $title.appendChild(wordSpan);
      if (wi < words.length - 1) {
        $title.appendChild(document.createTextNode(' '));
      }
    });
  })();

  // ============================================================
  // PLACEHOLDER ANIMÉ — effet machine à écrire (frappe + suppression)
  // ============================================================
  (function initInputFx() {
    const $fx = document.getElementById('chat-input-fx');
    if (!$fx) return;

    const phrases = [
      'Explique-moi le fonctionnement des trous noirs comme si j\'avais 10 ans.',
      'Quels sont 5 livres de science-fiction indispensables à lire absolument ?',
      'Rédige un e-mail professionnel pour refuser poliment une proposition de projet.',
      'Comment optimiser sa routine du soir pour améliorer la qualité de son sommeil ?',
      'Donne-moi une recette rapide en 15 minutes avec du riz, des œufs et des légumes.',
      'Quels sont les principes fondamentaux qui différencient le Web 2.0 du Web3 ?',
      'Écris le premier chapitre d\'une histoire captivante dans un univers cyberpunk.',
      'Comment fonctionne le système immunitaire face à une infection virale ?',
      'Propose un itinéraire optimisé de 3 jours pour visiter Rome à pied.',
      'Quelle est la différence entre l\'apprentissage supervisé et non supervisé en IA ?',
      'Donne-moi 5 conseils pour améliorer mon aisance à l\'oral en public.',
      'Comment se forment les aurores boréales et quelle est la meilleure période pour les voir ?',
      'Rédige un script Python simple pour automatiser le rangement d\'un dossier de téléchargements.',
      'Quels ont été les facteurs clés du déclenchement de la Première Guerre mondiale ?',
      'Comment mettre en place un budget personnel mensuel avec la règle des 50/30/20 ?',
      'Quelle est la différence entre l\'empathie cognitive et l\'empathie émotionnelle ?',
      'Quelles sont les méthodes les plus efficaces pour apprendre une langue étrangère en autonomie ?',
      'Écris un poème court d\'inspiration haïku sur le changement de saison.',
      'Explique le principe du tirage au sort et de la démocratie athénienne sous l\'Antiquité.',
      'Propose un programme d\'entraînement au poids du corps pour débutant sur 3 séances par semaine.'
    ];

    const TYPE_SPEED = 32;     // ms entre chaque lettre tapée
    const DELETE_SPEED = 14;   // ms entre chaque lettre supprimée
    const PAUSE_FULL = 1800;   // pause une fois la phrase entièrement tapée
    const PAUSE_EMPTY = 300;   // pause une fois la phrase entièrement effacée

    let idx = 0;
    let charPos = 0;
    let deleting = false;
    let fxTimer = null;
    let running = true;

    function renderTyped() {
      const phrase = phrases[idx];
      $fx.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'fx-phrase';
      span.textContent = phrase.slice(0, charPos);
      const caret = document.createElement('span');
      caret.className = 'fx-caret';
      span.appendChild(caret);
      $fx.appendChild(span);
    }

    function tick() {
      if (!running) return;
      const phrase = phrases[idx];

      if (!deleting) {
        charPos++;
        renderTyped();
        if (charPos >= phrase.length) {
          deleting = true;
          fxTimer = setTimeout(tick, PAUSE_FULL);
          return;
        }
        fxTimer = setTimeout(tick, TYPE_SPEED);
      } else {
        charPos--;
        renderTyped();
        if (charPos <= 0) {
          deleting = false;
          idx = (idx + 1) % phrases.length;
          fxTimer = setTimeout(tick, PAUSE_EMPTY);
          return;
        }
        fxTimer = setTimeout(tick, DELETE_SPEED);
      }
    }

    function updateVisibility() {
      // Visible tant que le champ est vide ; masqué dès qu'on tape
      const empty = $input.value.trim() === '';
      $fx.classList.toggle('wt-hidden', !empty);
      if (empty && running === false) {
        running = true;
        fxTimer = setTimeout(tick, TYPE_SPEED);
      } else if (!empty) {
        running = false;
        clearTimeout(fxTimer);
      }
    }

    renderTyped();
    fxTimer = setTimeout(tick, TYPE_SPEED);
    $input.addEventListener('input', updateVisibility);
    updateVisibility();
  })();

})();
</script>

<style>
/* ============================================================
   STYLES DES MESSAGES — repris du design system Wikimind_AI
   (structure .msg-group > .msg-inner > .bubble, mêmes animations
   d'entrée : glissement vertical + flou + léger scale)
   ============================================================ */
#messages { display: flex; flex-direction: column; gap: 0; padding: 24px 0 100px; }

.msg-group { display: flex; justify-content: center; padding: 4px 20px; }
.msg-group.user { justify-content: flex-end; }
.msg-group.ai   { justify-content: flex-start; }
.msg-group.ai   .msg-inner { max-width: min(760px, 100%); width: 100%; }
.msg-group.user .msg-inner { max-width: 78%; }

/* L'animation clé : c'est elle qui crée le "glissement" entre les messages */
.msg-inner {
  animation: msgIn 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(2px); }
  to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@media (min-width: 900px) {
  .msg-group { padding: 4px calc(50% - 380px); }
}

.bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 1rem;
  line-height: 1.7;
  word-break: break-word;
  white-space: pre-wrap;
}
.bubble.user {
  background: var(--bg3, #141414);
  border: 1px solid var(--border2, rgba(255,255,255,0.2));
  border-bottom-right-radius: 5px;
  color: var(--text, #fff);
}
.bubble.ai {
  background: transparent;
  padding-left: 0;
  padding-right: 0;
  color: var(--text, #fff);
}

.msg-image img { max-width: 360px; border-radius: 12px; display: block; }

/* Curseur clignotant — retiré systématiquement à la fin ou en cas d'erreur,
   jamais laissé affiché indéfiniment (c'était la cause du blocage visuel) */
.msg-cursor {
  display: inline-block;
  animation: blink 1s step-start infinite;
  color: var(--text3, #888);
  margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }

.msg-error-inline { color: #ff8080; font-style: italic; }

/* Indicateur "en train de réfléchir" — 3 points qui rebondissent en cascade */
.thinking-bubble {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  color: var(--text3, #888);
  font-size: 0.85rem;
}
.thinking-dots { position: relative; width: 28px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
.thinking-dots .td-wrap { position: relative; width: 30px; height: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.thinking-dots .td { width: 6px; height: 6px; border-radius: 50%; background: var(--text3, #888); flex-shrink: 0; transform-origin: center bottom; }
.thinking-dots .td1 { animation: tdBounce 0.9s cubic-bezier(.45,0,.55,1.4) infinite; animation-delay: 0s; }
.thinking-dots .td2 { animation: tdBounce 0.9s cubic-bezier(.45,0,.55,1.4) infinite; animation-delay: 0.15s; }
.thinking-dots .td3 { animation: tdBounce 0.9s cubic-bezier(.45,0,.55,1.4) infinite; animation-delay: 0.3s; }
@keyframes tdBounce {
  0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
  30%           { transform: translateY(-9px) scale(1.15); opacity: 1; }
}
.thinking-step-label {
  display: inline-block;
  font-style: italic;
  animation: thinkLabelIn 0.25s ease;
}
@keyframes thinkLabelIn {
  from { opacity: 0; transform: translateY(3px); filter: blur(1.5px); }
  to   { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* Bouton envoyer -> stop : reste cliquable (pour pouvoir interrompre),
   juste un style visuel différent le temps de la génération */
#send-btn.sending { background: var(--bg4); }
#send-btn.stop-mode svg { transition: transform 0.15s; }
#send-btn.stop-mode:hover svg { transform: scale(1.1); }

/* ========== ACTIONS SOUS UN MESSAGE IA (copier / régénérer / heure) ========== */
.msg-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-top: 6px;
  opacity: 0;
  transform: translateY(4px);
  animation: msgActionsIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: 0.1s;
}
@keyframes msgActionsIn {
  to { opacity: 1; transform: translateY(0); }
}
.msg-act-btn {
  width: 28px; height: 28px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, transform 0.1s;
  padding: 0;
}
.msg-act-btn svg { width: 14px; height: 14px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.msg-act-btn:hover { background: var(--bg3); color: var(--text); }
.msg-act-btn:active { transform: scale(0.82); }
.msg-act-btn.msg-act-copied { color: #7ee787; }
.msg-act-btn.msg-act-copied svg { animation: msgActPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.msg-act-btn.msg-act-spin svg { animation: msgActSpin 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes msgActPop {
  0%   { transform: scale(0.6); }
  60%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes msgActSpin {
  to { transform: rotate(360deg); }
}
.msg-act-time {
  font-size: 0.72rem;
  color: var(--text3);
  margin-left: 4px;
  user-select: none;
}

pre { background: #111; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
code { font-family: 'Geist Mono', monospace; background: #141414; padding: 1px 5px; border-radius: 4px; }
pre code { background: none; padding: 0; }
</style>

</body>
</html>
