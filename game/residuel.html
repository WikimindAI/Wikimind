<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RÉSIDUEL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;height:100%;width:100%;}
  #startScreen{
    position:fixed;inset:0;background:#000;color:#999;display:flex;
    align-items:center;justify-content:center;
    text-align:center;overflow:hidden;z-index:10;
  }
  #bgVideo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(0.85) contrast(1.05) brightness(0.8);
  }
  #startOverlay{
    position:relative;z-index:2;background:radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.6) 100%);
    width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;box-sizing:border-box;
  }
  #startScreen h1{
    font-family:'Press Start 2P',monospace;
    font-size:38px;letter-spacing:4px;line-height:1.5;margin:0 0 46px 0;
    color:#cfcac0;
    text-shadow:
      3px 3px 0 #000,
      0 0 18px rgba(0,0,0,0.9);
  }
  #startScreen h1 .gold{
    color:#e8c565;
    text-shadow:3px 3px 0 #000, 0 0 12px rgba(232,197,101,0.6), 0 0 22px rgba(0,0,0,0.9);
  }
  #menuButtons{
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .pixelBtn{
    font-family:'Press Start 2P',monospace;
    font-size:14px;letter-spacing:2px;
    color:#d8d2c6;background:#14110d;
    padding:14px 34px;
    border:4px solid #3a3226;
    box-shadow:0 0 0 2px #0a0806;
    cursor:pointer;
    transition:transform 0.08s ease, color 0.15s, border-color 0.15s;
    min-width:220px;
  }
  .pixelBtn:hover{
    color:#e8c565;border-color:#e8c565;
    box-shadow:0 0 0 2px #0a0806, 0 0 12px rgba(232,197,101,0.35);
    transform:translateY(-2px);
  }
  .pixelBtn:active{transform:translateY(1px);}
  #wikimindLogo{
    position:absolute;top:24px;left:50%;transform:translateX(-50%);
    width:64px;height:auto;z-index:3;
    filter:drop-shadow(0 0 6px rgba(0,0,0,0.9));
    pointer-events:none;
  }
  #startScreen .signature{
    position:absolute;bottom:16px;right:20px;font-size:11px;color:#555;
    letter-spacing:2px;text-shadow:0 0 6px #000;z-index:3;
  }
  #settingsMsg{
    position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);
    color:#d0c0a0;font-size:12px;letter-spacing:1px;opacity:0;
    transition:opacity 0.3s;z-index:3;pointer-events:none;
    text-shadow: 2px 2px 4px #000;
  }

  /* ---------- GAME ---------- */
  #gameContainer{
    position:fixed;inset:0;background:#000;display:none;z-index:5;
  }
  #gameCanvas{
    width:100%;height:100%;display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  #fadeLayer{
    position:fixed;inset:0;background:#000;z-index:20;
    opacity:0;pointer-events:none;transition:opacity 1.1s ease;
  }
  #fadeLayer.on{opacity:1;pointer-events:all;}

  #dialogueBox{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:min(720px,86%);
    background:rgba(8,8,8,0.82);
    border:3px solid #3a3226;
    box-shadow:0 0 0 2px #0a0806, 0 0 18px rgba(0,0,0,0.7);
    color:#e6e0d2;
    padding:16px 20px;
    font-family:'Courier New',monospace;
    font-size:16px;line-height:1.5;
    z-index:8;
    opacity:0;transition:opacity 0.25s;
    pointer-events:none;
    min-height: 80px;
  }
  #dialogueBox.show{opacity:1;pointer-events:all;cursor:pointer;}
  #dialogueName{
    font-family:'Press Start 2P',monospace;
    font-size:11px;color:#e8c565;margin-bottom:8px;letter-spacing:1px;
  }
  #dialogueHint{
    position:absolute;bottom:8px;right:14px;font-size:10px;color:#7a7566;
    letter-spacing:1px;
  }

  #torchOverlay{
    position:absolute;right:2%;bottom:0;
    width:260px;height:260px;
    z-index:9;pointer-events:none;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 10px rgba(255,210,120,0.25));
    opacity:0;transition:opacity 0.6s;
  }
  #torchOverlay.show{opacity:1;}

  #crosshair{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:6px;height:6px;background:rgba(230,210,150,0.5);
    border-radius:50%;z-index:7;pointer-events:none;opacity:0;
  }
  #crosshair.show{opacity:1;}

  #introTip{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:1px;color:#9a9384;
    background:rgba(0,0,0,0.5);padding:6px 14px;border:1px solid #2c271e;
    z-index:8;opacity:0;transition:opacity 0.5s;pointer-events:none;
  }
  #introTip.show{opacity:1;}

  /* ---------- SETTINGS PANEL ---------- */
  #settingsPanel{
    position:fixed;inset:0;background:rgba(0,0,0,0.86);
    display:none;align-items:center;justify-content:center;
    z-index:15;font-family:'Courier New',monospace;
  }
  #settingsPanel.show{display:flex;}
  #settingsCard{
    background:#0c0a08;border:4px solid #3a3226;
    box-shadow:0 0 0 2px #0a0806, 0 0 30px rgba(0,0,0,0.8);
    padding:34px 40px;min-width:380px;color:#d8d2c6;
  }
  #settingsCard h2{
    font-family:'Press Start 2P',monospace;font-size:16px;color:#e8c565;
    margin:0 0 26px 0;letter-spacing:2px;text-align:center;
  }
  .settingRow{margin-bottom:22px;}
  .settingRow label{
    display:flex;justify-content:space-between;font-size:13px;
    letter-spacing:1px;margin-bottom:8px;color:#c8c0ac;
  }
  .settingRow .val{color:#e8c565;}
  .settingRow input[type=range]{
    width:100%;-webkit-appearance:none;height:4px;background:#3a3226;outline:none;
  }
  .settingRow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;background:#e8c565;
    border:2px solid #0a0806;cursor:pointer;
  }
  .qualityRow{display:flex;gap:8px;}
  .qualityBtn{
    flex:1;padding:8px 0;text-align:center;font-size:11px;letter-spacing:1px;
    border:2px solid #3a3226;color:#a89f8c;cursor:pointer;background:#14110d;
    transition:all 0.15s;
  }
  .qualityBtn.active{color:#e8c565;border-color:#e8c565;box-shadow:0 0 8px rgba(232,197,101,0.3);}
  #settingsClose{margin-top:12px;width:100%;}
</style>
</head>
<body>
<div id="startScreen">
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="vid.mp4" type="video/mp4">
  </video>
  <img id="wikimindLogo" src="../wikimind.png" alt="Wikimind">
  <div id="startOverlay">
    <h1>RÉSID<span class="gold">U</span>EL</h1>
    <div id="menuButtons">
      <button class="pixelBtn" id="btnPlay">JOUER</button>
      <button class="pixelBtn" id="btnSettings">PARAMÈTRES</button>
    </div>
  </div>
  <div class="signature">by Wikimind</div>
</div>
<div id="settingsMsg"></div>

<div id="settingsPanel">
  <div id="settingsCard">
    <h2>PARAMÈTRES</h2>
    <div class="settingRow">
      <label>Qualité graphique</label>
      <div class="qualityRow">
        <div class="qualityBtn" data-q="low">FAIBLE</div>
        <div class="qualityBtn active" data-q="medium">MOYEN</div>
        <div class="qualityBtn" data-q="high">ÉLEVÉ</div>
      </div>
    </div>
    <div class="settingRow">
      <label>Sensibilité souris <span class="val" id="sensVal">100%</span></label>
      <input type="range" id="sensRange" min="30" max="200" value="100">
    </div>
    <div class="settingRow">
      <label>Champ de vision <span class="val" id="fovVal">62°</span></label>
      <input type="range" id="fovRange" min="50" max="90" value="62">
    </div>
    <div class="settingRow">
      <label>Intensité lampe torche <span class="val" id="torchVal">100%</span></label>
      <input type="range" id="torchRange" min="40" max="160" value="100">
    </div>
    <button class="pixelBtn" id="settingsClose">FERMER</button>
  </div>
</div>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueHint">clique / espace ▸</div>
  </div>
  <canvas id="torchOverlay"></canvas>
  <div id="crosshair"></div>
  <div id="introTip">ZQSD / WASD — souris pour regarder</div>
</div>

<div id="fadeLayer"></div>

<script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
<script>
/* ================= MENU ================= */
/* ================= PARAMÈTRES (fonctionnels) ================= */
const GFX = {
  quality: 'medium',   // low / medium / high
  sensitivity: 1.0,    // multiplicateur souris
  fov: 62,
  torchPower: 1.0
};

const qualityPresets = {
  low:    { renderScale: 0.20, shadows: false, fog: 0.030, lampCount: 0.5, pixelRatioCap: 1 },
  medium: { renderScale: 0.28, shadows: false, fog: 0.028, lampCount: 1,   pixelRatioCap: 1 },
  high:   { renderScale: 0.42, shadows: true,  fog: 0.022, lampCount: 1,   pixelRatioCap: 1.5 }
};

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.add('show');
});
document.getElementById('settingsClose').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('show');
});

document.querySelectorAll('.qualityBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.qualityBtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    GFX.quality = btn.dataset.q;
    applyGraphicsSettings();
  });
});

const sensRange = document.getElementById('sensRange');
sensRange.addEventListener('input', ()=>{
  GFX.sensitivity = sensRange.value/100;
  document.getElementById('sensVal').textContent = sensRange.value + '%';
});

const fovRange = document.getElementById('fovRange');
fovRange.addEventListener('input', ()=>{
  GFX.fov = parseInt(fovRange.value);
  document.getElementById('fovVal').textContent = fovRange.value + '°';
  if(typeof camera !== 'undefined' && camera){
    camera.fov = GFX.fov;
    camera.updateProjectionMatrix();
  }
});

const torchRange = document.getElementById('torchRange');
torchRange.addEventListener('input', ()=>{
  GFX.torchPower = torchRange.value/100;
  document.getElementById('torchVal').textContent = torchRange.value + '%';
  if(typeof flashlight !== 'undefined' && flashlight){
    flashlight.intensity = 3.2 * GFX.torchPower;
  }
});

// Appliquée dynamiquement pendant le jeu (au resize suivant)
function applyGraphicsSettings(){
  if(typeof renderer !== 'undefined' && renderer && typeof camera !== 'undefined' && camera){
    resizeRenderer();
    renderer.shadowMap.enabled = qualityPresets[GFX.quality].shadows;
    if(scene && scene.fog) scene.fog.density = qualityPresets[GFX.quality].fog;
  }
}

const fadeLayer = document.getElementById('fadeLayer');
function fadeOut(duration){
  return new Promise(res=>{
    fadeLayer.style.transition = `opacity ${duration}ms ease`;
    fadeLayer.classList.add('on');
    setTimeout(res, duration);
  });
}
function fadeIn(duration){
  return new Promise(res=>{
    fadeLayer.style.transition = `opacity ${duration}ms ease`;
    fadeLayer.classList.remove('on');
    setTimeout(res, duration);
  });
}

document.getElementById('btnPlay').addEventListener('click', async () => {
  await fadeOut(900);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'block';
  initGame();
  await fadeIn(1300);
  startTaxiDialogue();
});

const torchCanvas = document.getElementById('torchOverlay');
const tctx = torchCanvas.getContext('2d');
tctx.imageSmoothingEnabled = false;
function drawTorchOverlay(){
  torchCanvas.width = 260; torchCanvas.height = 260;
  const small = document.createElement('canvas');
  small.width = 40; small.height = 40;
  const sctx = small.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  sctx.save();
  sctx.translate(20,20);
  sctx.rotate(0.55);
  sctx.drawImage(torchImg, -26, -14, 52, 28);
  sctx.restore();
  tctx.imageSmoothingEnabled = false;
  tctx.clearRect(0,0,260,260);
  tctx.drawImage(small, 0,0,40,40, 40,60,220,220);
}
torchImg.onload = drawTorchOverlay;

let renderer, scene, camera, clock;
let mode = 'taxi';
let flashlight, flashTarget;
let buildings = [];
let streetlights = [];
let taxiGroup, driverGroup;
let keys = {};
let yaw = 0, pitch = 0;
let playerRig;
let pointerLocked = false;
let exteriorState = 'start'; // start, heard_noise, check_behind, chased, escaped, caught
let typeInterval = null;
let isTyping = false;
let currentFullText = "";

function resizeRenderer(){
  const preset = qualityPresets[GFX.quality];
  const w = Math.max(160, Math.floor(window.innerWidth*preset.renderScale));
  const h = Math.max(90, Math.floor(window.innerHeight*preset.renderScale));
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, preset.pixelRatioCap));
  renderer.setSize(w, h, false);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.fov = GFX.fov;
  camera.updateProjectionMatrix();
}

function initGame(){
  const canvas = document.getElementById('gameCanvas');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.outputEncoding = THREE.sRGBEncoding !== undefined ? THREE.sRGBEncoding : renderer.outputEncoding;
  if(renderer.toneMapping !== undefined){
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
  }
  renderer.shadowMap.enabled = qualityPresets[GFX.quality].shadows;
  if(renderer.shadowMap) renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);

  camera = new THREE.PerspectiveCamera(GFX.fov, window.innerWidth/window.innerHeight, 0.05, 120);
  window.addEventListener('resize', resizeRenderer);

  clock = new THREE.Clock();

  buildTaxiScene();

  resizeRenderer();
  animate();
}

function makeStreetlight(x,z){
  const g = new THREE.Group();
  const poleMat = new THREE.MeshStandardMaterial({color:0x0e1014, roughness:0.6, metalness:0.4});
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,3.2,8), poleMat);
  pole.position.y = 1.6;
  g.add(pole);

  // Bras
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,6), poleMat);
  arm.rotation.z = Math.PI/2.4;
  arm.position.set(0.22, 3.1, 0);
  g.add(arm);

  // Abat-jour (cône) au-dessus de l'ampoule
  const shadeMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.5, metalness:0.5});
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22,0.22,10,1,true), shadeMat);
  shade.rotation.x = Math.PI;
  shade.position.set(0.42, 3.28, 0);
  g.add(shade);

  const lampGeo = new THREE.SphereGeometry(0.15,10,10);
  const lampMat = new THREE.MeshStandardMaterial({color:0xffdd88, emissive:0xffcc66, emissiveIntensity:1.8});
  const lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.set(0.42, 3.1, 0);
  g.add(lamp);

  const light = new THREE.PointLight(0xffc178, 1.3, 7, 2);
  light.position.set(0.42, 3.05, 0);
  g.add(light);

  // Halo doux (sprite additif) pour donner du volume à la lumière sans coût de perf
  const haloCanvas = document.createElement('canvas');
  haloCanvas.width = 64; haloCanvas.height = 64;
  const hctx = haloCanvas.getContext('2d');
  const grad = hctx.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(255,205,140,0.55)');
  grad.addColorStop(1,'rgba(255,205,140,0)');
  hctx.fillStyle = grad;
  hctx.fillRect(0,0,64,64);
  const haloTex = new THREE.CanvasTexture(haloCanvas);
  const haloMat = new THREE.SpriteMaterial({map:haloTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
  const halo = new THREE.Sprite(haloMat);
  halo.scale.set(1.6,1.6,1.6);
  halo.position.set(0.42, 3.1, 0);
  g.add(halo);

  g.position.set(x,0,z);
  g.userData.flickerSeed = Math.random()*10;
  g.userData.lamp = lamp; g.userData.light = light; g.userData.halo = halo;
  scene.add(g);
  streetlights.push(g);
}

const sharedWindowMats = [0xffe9a8, 0xffd98a, 0xfff2c8].map(c=> new THREE.MeshBasicMaterial({color:c}));

function makeBuilding(x,z,w,h,d,colorSeed){
  const colors = [0x171b23,0x1b2029,0x11141a,0x1e222b,0x151920];
  const mat = new THREE.MeshStandardMaterial({
    color: colors[colorSeed%colors.length],
    roughness: 0.85 + Math.random()*0.1,
    metalness: 0.05
  });
  const geo = new THREE.BoxGeometry(w,h,d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z);
  scene.add(mesh);

  // Corniche sombre en haut du bâtiment (détail silhouette)
  const ledge = new THREE.Mesh(
    new THREE.BoxGeometry(w*1.06, 0.18, d*1.06),
    new THREE.MeshStandardMaterial({color:0x0a0c10, roughness:0.9})
  );
  ledge.position.set(x, h+0.09, z);
  scene.add(ledge);
  buildings.push(ledge);

  for(let i=0;i<Math.floor(h/1.4);i++){
    if(Math.random()>0.55) continue;
    const winMat = sharedWindowMats[Math.floor(Math.random()*sharedWindowMats.length)];
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.7), winMat);
    win.position.set(x + w/2 + 0.01, 1 + i*1.4, z + (Math.random()-0.5)*d*0.6);
    win.rotation.y = -Math.PI/2;
    win.userData.flicker = Math.random() < 0.12;
    win.userData.flickerSeed = Math.random()*10;
    scene.add(win);
    buildings.push(win);
  }
  buildings.push(mesh);
  return mesh;
}

function buildTaxiScene(){
  mode = 'taxi';
  scene.fog = new THREE.FogExp2(0x05070c, qualityPresets[GFX.quality].fog);
  scene.add(new THREE.HemisphereLight(0x39466e, 0x0a0806, 1.6));
  scene.add(new THREE.AmbientLight(0x404a6a, 0.9));
  const moon = new THREE.DirectionalLight(0x8d9bc0, 0.8);
  moon.position.set(-10, 20, -8);
  scene.add(moon);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(14,400), new THREE.MeshStandardMaterial({color:0x0d0d10}));
  road.rotation.x = -Math.PI/2;
  road.position.z = -150;
  scene.add(road);

  for(let i=0;i<40;i++){
    const z = -i*10 - 5;
    makeBuilding(-9 - Math.random()*3, z, 5+Math.random()*3, 4+Math.random()*8, 6, i);
    makeBuilding(9 + Math.random()*3, z, 5+Math.random()*3, 4+Math.random()*8, 6, i+1);

      makeStreetlight(-6, z);
      makeStreetlight(6, z-5);
    }
  }

  taxiGroup = new THREE.Group();
  const dashMat = new THREE.MeshStandardMaterial({color:0x0b0b0d, roughness:0.7});
  const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.6), dashMat);
  dash.position.set(0, -0.35, -1.0);
  taxiGroup.add(dash);

  // Petit éclairage du tableau de bord (ambiance intérieure chaleureuse)
  const dashLight = new THREE.PointLight(0xffaa55, 0.4, 1.5, 2);
  dashLight.position.set(0, -0.1, -0.9);
  taxiGroup.add(dashLight);

  // Rétroviseur suspendu
  const mirrorMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.4, metalness:0.6});
  const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.06,0.03), mirrorMat);
  mirror.position.set(0, 0.85, -0.85);
  taxiGroup.add(mirror);

  const wheelMat = new THREE.MeshStandardMaterial({color:0x151515, roughness:0.5, metalness:0.3});
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,8,16), wheelMat);
  wheel.position.set(-0.35,-0.05,-1.15);
  taxiGroup.add(wheel);

  driverGroup = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({color:0x2a2f3a});
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.55,4,8), bodyMat);
  body.position.set(-0.55,0.1,-1.35);
  driverGroup.add(body);
  const headMat = new THREE.MeshStandardMaterial({color:0xc9a583});
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), headMat);
  head.position.set(-0.55,0.55,-1.35);
  driverGroup.add(head);
  taxiGroup.add(driverGroup);

  const frameMat = new THREE.MeshStandardMaterial({color:0x08080a});
  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.15,2.2), frameMat);
  frameTop.position.set(0,1.05,-0.7);
  taxiGroup.add(frameTop);

  scene.add(taxiGroup);
  taxiGroup.position.set(0,0.6,0);

  camera.position.set(0.35, 0.95, 0.4);
  camera.rotation.set(0,0,0);
  camera.lookAt(0,0.7,-1.2);
}

let taxiSpeed = 6;
function updateTaxiRide(dt){
  buildings.forEach(b=>{ b.position.z += dt*taxiSpeed; });
  streetlights.forEach(g=>{ g.position.z += dt*taxiSpeed; });
  taxiGroup.position.y = 0.6 + Math.sin(clock.elapsedTime*3)*0.01;
  camera.position.y = 0.95 + Math.sin(clock.elapsedTime*3)*0.01;
}

/* ---------- Dialogue ---------- */
const dialogueBox = document.getElementById('dialogueBox');
const dialogueName = document.getElementById('dialogueName');
const dialogueText = document.getElementById('dialogueText');
let dialogueQueue = [];
let dialogueActive = false;
let onDialogueEnd = null;

const taxiLines = [
  ["CHAUFFEUR","Alors, on va où ce soir?"],
  ["MOI","Au musée d'histoire, s'il vous plaît."],
  ["CHAUFFEUR","Le musée, hein... C'est drôlement calme là-bas cette semaine."],
  ["MOI","C'est mon premier jour. Mon premier vrai boulot."],
  ["CHAUFFEUR","Ah, félicitations. Gardien de nuit?"],
  ["MOI","Oui. Un peu stressant, je dois avouer."],
  ["CHAUFFEUR","Ça va aller. Les vieux bâtiments comme ça... ils ont juste besoin qu'on s'habitue à eux."],
  ["CHAUFFEUR","On arrive. Je vous dépose devant."]
];

function showDialogueLine(){
  if(dialogueQueue.length === 0){
    dialogueBox.classList.remove('show');
    dialogueActive = false;
    if(onDialogueEnd) { const cb = onDialogueEnd; onDialogueEnd = null; cb(); }
    return;
  }
  const [name, text] = dialogueQueue.shift();
  dialogueName.textContent = name;
  currentFullText = text;
  dialogueText.textContent = "";
  dialogueBox.classList.add('show');
  dialogueActive = true;
  isTyping = true;

  let i = 0;
  if(typeInterval) clearInterval(typeInterval);
  typeInterval = setInterval(() => {
    dialogueText.textContent += text.charAt(i);
    i++;
    if(i >= text.length) {
      clearInterval(typeInterval);
      isTyping = false;
    }
  }, 30);
}

function advanceDialogue(){
  if(!dialogueActive) return;
  if(isTyping) {
    clearInterval(typeInterval);
    dialogueText.textContent = currentFullText;
    isTyping = false;
  } else {
    showDialogueLine();
  }
}

dialogueBox.addEventListener('click', advanceDialogue);
window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='Space' && dialogueActive){ advanceDialogue(); e.preventDefault(); }
});
window.addEventListener('keyup', e=> keys[e.code] = false);

function startTaxiDialogue(){
  dialogueQueue = taxiLines.slice();
  onDialogueEnd = arriveAtMuseum;
  showDialogueLine();
}

async function arriveAtMuseum(){
  taxiSpeed = 0;
  await new Promise(r=>setTimeout(r, 700));
  await fadeOut(1000);
  buildExteriorScene();
  await fadeIn(1300);
  document.getElementById('introTip').classList.add('show');
  document.getElementById('torchOverlay').classList.add('show');
  document.getElementById('crosshair').classList.add('show');
  setTimeout(()=> document.getElementById('introTip').classList.remove('show'), 4500);
  requestPointerLock();
}

/* ---------- Exterior / museum / free-roam ---------- */
function buildExteriorScene(){
  mode = 'exterior';
  while(scene.children.length){ scene.remove(scene.children[0]); }
  buildings = []; streetlights = [];
  
  scene.fog = new THREE.FogExp2(0x030407, qualityPresets[GFX.quality].fog + 0.01);
  scene.add(new THREE.HemisphereLight(0x2c3554, 0x040406, 1.4));
  scene.add(new THREE.AmbientLight(0x404a6a, 0.7));
  const moon = new THREE.DirectionalLight(0x8d9bc0, 0.65);
  moon.position.set(-10,20,-8);
  scene.add(moon);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x0c0c0e}));
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // Museum main body
  const museumMat = new THREE.MeshStandardMaterial({color:0x222224, roughness:0.8});
  const museum = new THREE.Mesh(new THREE.BoxGeometry(16,8,8), museumMat);
  museum.position.set(0, 5.125, -12.6);
  scene.add(museum);

  // Colonnes
  for(let i=-6;i<=6;i+=4){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,6.6,12), new THREE.MeshStandardMaterial({color:0xc9c3b5}));
    col.position.set(i, 4.425, -8.6);
    scene.add(col);
  }

  // Tapis Rouge & Marches
  for(let s=0;s<5;s++){
    const stepW = 12 - s*0.5;
    const step = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.25, 1.0), new THREE.MeshStandardMaterial({color:0x333333}));
    step.position.set(0, 0.125 + s*0.25, -4 - s*1);
    scene.add(step);

    const carpet = new THREE.Mesh(new THREE.BoxGeometry(3, 0.26, 1.05), new THREE.MeshStandardMaterial({color:0x991111}));
    carpet.position.set(0, 0.125 + s*0.25, -4 - s*1);
    scene.add(carpet);
  }

  // Portes (doubles)
  const doorMat = new THREE.MeshStandardMaterial({color: 0x3a2518, roughness: 0.9});
  const doorLeft = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3, 0.2), doorMat);
  doorLeft.position.set(-0.72, 2.625, -8.6);
  scene.add(doorLeft);
  const doorRight = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3, 0.2), doorMat);
  doorRight.position.set(0.72, 2.625, -8.6);
  scene.add(doorRight);

  // Pancarte MUSÉE
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f2e3b0';
  ctx.fillRect(0,0,1024,256);
  ctx.font = 'bold 100px "Courier New", monospace';
  ctx.fillStyle = '#1a1a1c';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText("MUSEE D'HISTOIRE", 512, 128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const signMat = new THREE.MeshStandardMaterial({map: tex, roughness: 0.6});
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), signMat);
  sign.position.set(0, 6.8, -8.55);
  scene.add(sign);

  for(let i=0;i<10;i++){
    const z = -2 + i*3;
    makeBuilding(-13, z, 4+Math.random()*2, 5+Math.random()*10, 6, i);
    makeBuilding(13, z, 4+Math.random()*2, 5+Math.random()*10, 6, i+1);
  }
  makeStreetlight(-4,-2); makeStreetlight(4,-2);
  makeStreetlight(-8,4); makeStreetlight(8,4);

  // Taxi garé
  const parkedTaxi = new THREE.Group();
  const taxiBodyMat = new THREE.MeshStandardMaterial({color:0xf0c419, roughness:0.35, metalness:0.4});
  const tb = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), taxiBodyMat);
  tb.position.y = 0.6;
  parkedTaxi.add(tb);
  const tt = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2), new THREE.MeshStandardMaterial({color:0x1c2430, roughness:0.2, metalness:0.5}));
  tt.position.set(0, 1.3, -0.2);
  parkedTaxi.add(tt);
  const twGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 12);
  twGeo.rotateZ(Math.PI/2);
  const twMat = new THREE.MeshStandardMaterial({color:0x111, roughness:0.6});
  const w1 = new THREE.Mesh(twGeo, twMat); w1.position.set(-1, 0.35, 1.2); parkedTaxi.add(w1);
  const w2 = new THREE.Mesh(twGeo, twMat); w2.position.set(1, 0.35, 1.2); parkedTaxi.add(w2);
  const w3 = new THREE.Mesh(twGeo, twMat); w3.position.set(-1, 0.35, -1.2); parkedTaxi.add(w3);
  const w4 = new THREE.Mesh(twGeo, twMat); w4.position.set(1, 0.35, -1.2); parkedTaxi.add(w4);
  // Phares avant (émissifs, sans coût de lumière dynamique)
  const headlightMat = new THREE.MeshStandardMaterial({color:0xfff6d8, emissive:0xffe9a0, emissiveIntensity:1.2});
  const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8), headlightMat); hl1.position.set(-0.7,0.65,2.0); parkedTaxi.add(hl1);
  const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8), headlightMat); hl2.position.set(0.7,0.65,2.0); parkedTaxi.add(hl2);
  // Bande à damiers de taxi (petite pancarte sur le toit)
  const topSignMat = new THREE.MeshStandardMaterial({color:0x0f0f10, emissive:0x332200, emissiveIntensity:0.3});
  const topSign = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,1.0), topSignMat);
  topSign.position.set(0, 1.7, -0.2);
  parkedTaxi.add(topSign);
  parkedTaxi.position.set(5, 0, 4);
  parkedTaxi.rotation.y = Math.PI / 6;
  scene.add(parkedTaxi);

  // Le Stalker (Chauffeur)
  window.evilDriver = new THREE.Group();
  const dBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1.1, 4, 8), new THREE.MeshStandardMaterial({color:0x2a2f3a}));
  dBody.position.y = 0.9;
  window.evilDriver.add(dBody);
  const dHead = new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshStandardMaterial({color:0xc9a583}));
  dHead.position.y = 1.75;
  window.evilDriver.add(dHead);
  window.evilDriver.position.set(4, 0, 4); // À côté du taxi
  scene.add(window.evilDriver);

  flashlight = new THREE.SpotLight(0xfff2c8, 3.2*GFX.torchPower, 14, Math.PI/7, 0.5, 1.2);
  flashlight.position.set(0,0,0);
  flashTarget = new THREE.Object3D();
  scene.add(flashlight, flashTarget);
  flashlight.target = flashTarget;
  camera.add(flashlight);
  camera.add(flashTarget);
  flashTarget.position.set(0,0,-1);
  scene.add(camera);

  playerRig = { x:0, y:1.6, z:6 };
  camera.position.set(playerRig.x, playerRig.y, playerRig.z);
  yaw = Math.PI; pitch = 0;
  exteriorState = 'start';
}

function requestPointerLock(){
  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('click', ()=>{
    if(mode==='exterior') canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', ()=>{
    pointerLocked = document.pointerLockElement === canvas;
  });
  document.addEventListener('mousemove', e=>{
    if(!pointerLocked || mode!=='exterior') return;
    yaw -= e.movementX * 0.0022 * GFX.sensitivity;
    pitch -= e.movementY * 0.0022 * GFX.sensitivity;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
  });
}

function updateExteriorMovement(dt){
  if(exteriorState === 'caught' || exteriorState === 'escaped') return;

  const speed = 3.8 * dt;
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw+Math.PI/2), 0, Math.cos(yaw+Math.PI/2));
  let mv = new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp']) mv.add(forward);
  if(keys['KeyS']||keys['ArrowDown']) mv.sub(forward);
  if(keys['KeyD']||keys['ArrowRight']) mv.add(right);
  if(keys['KeyA']||keys['ArrowLeft']) mv.sub(right);
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(speed); playerRig.x += mv.x; playerRig.z += mv.z; }

  const bob = Math.sin(clock.elapsedTime*8) * (mv.lengthSq()>0 ? 0.04 : 0);
  camera.position.set(playerRig.x, playerRig.y+bob, playerRig.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  // Stalker Logic
  if(!window.evilDriver) return;

  const pPos = new THREE.Vector3(playerRig.x, 0, playerRig.z);
  const dPos = window.evilDriver.position;

  if(exteriorState === 'start') {
    // Il nous suit doucement
    if(dPos.distanceTo(pPos) > 4.5) {
        const dir = new THREE.Vector3().subVectors(pPos, dPos).normalize();
        window.evilDriver.position.addScaledVector(dir, 1.8 * dt);
    }

    if(playerRig.z < 1) { // On s'approche du musée
        exteriorState = 'heard_noise';
        dialogueQueue = [["MOI", "J'ai entendu des pas rapides derrière moi..."]];
        onDialogueEnd = () => {
            exteriorState = 'check_behind';
            // On le téléporte pour s'assurer qu'il soit vu et menaçant quand on se retourne
            window.evilDriver.position.set(playerRig.x + (Math.random()>0.5?1:-1), 0, playerRig.z + 4);
        };
        showDialogueLine();
    }
  }
  else if(exteriorState === 'check_behind') {
    const lookDir = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    if(lookDir.z > 0.4) { // On s'est retourné
        exteriorState = 'chased';
    }
  }
  else if(exteriorState === 'chased') {
    // Il court vers nous
    const dir = new THREE.Vector3().subVectors(pPos, dPos).normalize();
    window.evilDriver.position.addScaledVector(dir, 4.3 * dt);

    if(dPos.distanceTo(pPos) < 1.2) {
        exteriorState = 'caught';
        fadeOut(300).then(() => {
            document.getElementById('dialogueBox').style.display = 'none';
            const msg = document.getElementById('settingsMsg');
            msg.textContent = 'IL VOUS A EU...';
            msg.style.opacity = 1;
            msg.style.color = '#ff0000';
            msg.style.fontSize = '24px';
            msg.style.bottom = '50vh';
            setTimeout(()=>location.reload(), 3000);
        });
    }
    else if(playerRig.z < -7.0) { // On est arrivé aux portes
        exteriorState = 'escaped';
        enterMuseumSafe();
    }
  }
}

async function enterMuseumSafe() {
  await fadeOut(200);
  document.getElementById('dialogueBox').classList.remove('show');
  dialogueActive = false;
  setTimeout(() => {
      const msg = document.getElementById('settingsMsg');
      msg.textContent = 'PORTES VERROUILLÉES. VOUS ÊTES EN SÉCURITÉ.';
      msg.style.opacity = 1;
      msg.style.color = '#ffffff';
      msg.style.bottom = '50vh';
      msg.style.fontSize = '18px';
  }, 500);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(mode==='taxi') updateTaxiRide(dt);
  if(mode==='exterior' && !dialogueActive) updateExteriorMovement(dt);

  // Scintillement lampadaires (léger, façon néon fatigué)
  const t = clock.elapsedTime;
  streetlights.forEach(g=>{
    const seed = g.userData.flickerSeed || 0;
    const flick = 0.85 + 0.15*Math.sin(t*7 + seed) + (Math.random()<0.01 ? -0.4 : 0);
    if(g.userData.light) g.userData.light.intensity = Math.max(0.2, 1.3*flick);
    if(g.userData.lamp) g.userData.lamp.material.emissiveIntensity = Math.max(0.4, 1.8*flick);
    if(g.userData.halo) g.userData.halo.material.opacity = Math.max(0.15, 0.55*flick);
  });

  // Fenêtres qui scintillent occasionnellement (télé allumée la nuit)
  buildings.forEach(b=>{
    if(b.userData && b.userData.flicker){
      b.visible = Math.sin(t*3 + b.userData.flickerSeed) > -0.7;
    }
  });

  renderer.render(scene, camera);
}
