<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RÉSIDUEL - Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital@1&display=swap');
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;}
  #renderCanvas{width:100vw;height:100vh;display:block;image-rendering:pixelated;}
  #crosshair{
    position:fixed;top:50%;left:50%;width:4px;height:4px;
    background:rgba(255,255,255,0.6);border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;z-index:10;
  }
  #hud{
    position:fixed;bottom:20px;left:20px;color:#8a8a8a;font-size:13px;
    letter-spacing:1px;text-shadow:0 0 4px #000;pointer-events:none;z-index:10;
  }
  #objective{
    position:fixed;top:20px;left:20px;color:#b0a090;font-size:13px;
    letter-spacing:1px;text-shadow:0 0 4px #000;pointer-events:none;z-index:10;
    max-width:300px;
  }
  #startScreen{
    position:fixed;inset:0;background:#000;color:#999;display:flex;
    flex-direction:column;align-items:center;justify-content:center;z-index:100;
    text-align:center;cursor:pointer;overflow:hidden;
  }
  #bgCanvas{
    position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;
  }
  #startOverlay{
    position:relative;z-index:2;background:radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%);
    width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  #startScreen h1{
    color:#d4b96a;letter-spacing:10px;font-weight:600;font-size:52px;margin-bottom:14px;
    font-family:'Cinzel',serif;text-shadow:0 0 20px rgba(212,185,106,0.35), 0 0 40px rgba(0,0,0,0.9);
  }
  #startScreen p{
    font-family:'EB Garamond',serif;font-style:italic;font-size:16px;color:#a8a096;
    max-width:420px;line-height:1.8;text-shadow:0 0 6px #000;
  }
  #startScreen .signature{
    position:absolute;bottom:16px;right:20px;font-size:11px;color:#555;
    letter-spacing:2px;text-shadow:0 0 6px #000;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:9;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  }
  #pickupMsg{
    position:fixed;top:60%;left:50%;transform:translate(-50%,-50%);
    color:#d0c0a0;font-size:12px;letter-spacing:1px;opacity:0;
    transition:opacity 0.3s;z-index:10;pointer-events:none;
  }
  #interactPrompt{
    position:fixed;top:55%;left:50%;transform:translate(-50%,-50%);
    color:#999;font-size:11px;opacity:0;transition:opacity 0.2s;z-index:10;pointer-events:none;
  }
</style>
</head>
<body>
<div id="startScreen">
  <canvas id="bgCanvas"></canvas>
  <div id="startOverlay">
    <h1>RÉSIDUEL</h1>
    <p>ZQSD / WASD pour te déplacer — Souris pour regarder<br>
    Clique pour commencer (verrouille la souris)<br>
    E pour interagir — Trouve les 4 objets rituels<br><br>
    <em>Ne reste pas trop longtemps dans le noir.</em></p>
  </div>
  <div class="signature">by Wikimind</div>
</div>
<canvas id="renderCanvas"></canvas>
<div id="crosshair"></div>
<div id="vignette"></div>
<div id="hud">Objets trouvés : <span id="itemCount">0</span> / 4</div>
<div id="objective">Trouve les objets rituels dispersés dans le manoir.</div>
<div id="interactPrompt">[E] Ramasser</div>
<div id="pickupMsg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ SCÈNE D'ARRIÈRE-PLAN DE L'ÉCRAN D'ACCUEIL ============
(function(){
  const bgCanvas = document.getElementById('bgCanvas');
  const W = 320, H = 180;
  const bgRenderer = new THREE.WebGLRenderer({canvas:bgCanvas, antialias:false});
  bgRenderer.setSize(W,H,false);

  const bgScene = new THREE.Scene();
  bgScene.background = new THREE.Color(0x0a0806);
  bgScene.fog = new THREE.FogExp2(0x0a0806, 0.05);

  const bgCam = new THREE.PerspectiveCamera(65, W/H, 0.05, 30);
  bgCam.position.set(0, 1.5, 0);

  const bgAmbient = new THREE.AmbientLight(0x3a2f1e, 0.85);
  bgScene.add(bgAmbient);

  // plusieurs lampes chaudes façon éclairage de galerie
  const lampPositions = [
    [1.8, 2.4, -3.2], [-1.8, 2.4, -3.2], [1.8, 2.4, 3.2], [-1.8, 2.4, 3.2], [0,2.4,0]
  ];
  const lamps = [];
  lampPositions.forEach(p => {
    const l = new THREE.PointLight(0xffc478, 1.6, 8, 2);
    l.position.set(p[0],p[1],p[2]);
    bgScene.add(l);
    lamps.push(l);
  });

  const matWall = new THREE.MeshLambertMaterial({color:0x453b2c});
  const matFloor = new THREE.MeshLambertMaterial({color:0x2a2219});
  const matGold = new THREE.MeshStandardMaterial({color:0xcfa93c, emissive:0x3a2a05, metalness:0.6, roughness:0.35});
  const matFrame = new THREE.MeshStandardMaterial({color:0xb8933a, metalness:0.5, roughness:0.4});
  const matPainting = new THREE.MeshLambertMaterial({color:0x1a1512});
  const matPedestal = new THREE.MeshLambertMaterial({color:0x3a3228});

  function box(w,h,d,x,y,z,mat){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z);
    bgScene.add(m);
    return m;
  }

  // grande galerie
  box(9,3.2,0.2, 0,1.6,-4.5, matWall);
  box(9,3.2,0.2, 0,1.6, 4.5, matWall);
  box(0.2,3.2,9, -4.5,1.6,0, matWall);
  box(0.2,3.2,9,  4.5,1.6,0, matWall);
  box(9,0.2,9, 0,-0.1,0, matFloor);
  box(9,0.2,9, 0,3.2,0, matWall);

  // cadres dorés avec tableaux sombres
  function painting(x,y,z,rotY,w,h){
    const g = new THREE.Group();
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.08), matFrame);
    const canvas = new THREE.Mesh(new THREE.BoxGeometry(w-0.15,h-0.15,0.02), matPainting);
    canvas.position.z = 0.05;
    g.add(frame, canvas);
    g.position.set(x,y,z);
    g.rotation.y = rotY;
    bgScene.add(g);
  }
  painting(-2.5, 1.7, -4.38, 0, 1.3, 1.7);
  painting(2.5, 1.7, -4.38, 0, 1.3, 1.7);
  painting(-4.38, 1.7, -1.5, Math.PI/2, 1.2, 1.6);
  painting(-4.38, 1.7, 1.8, Math.PI/2, 1.2, 1.6);
  painting(4.38, 1.7, -1, -Math.PI/2, 1.2, 1.6);

  // statues dorées sur socles
  function statue(x,z){
    const pedestal = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.9,0.6), matPedestal);
    pedestal.position.set(x,0.45,z);
    bgScene.add(pedestal);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.22,0.9,8), matGold);
    body.position.set(x,1.35,z);
    bgScene.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6), matGold);
    head.position.set(x,1.9,z);
    bgScene.add(head);
  }
  statue(-2, 2.4);
  statue(2, -2.2);
  statue(0, 0);

  let lampFlicker = 0;
  const clock = new THREE.Clock();
  let angle = 0;
  function animateBg(){
    if(document.getElementById('startScreen').style.display === 'none'){
      return; // stop dès que le jeu démarre
    }
    requestAnimationFrame(animateBg);
    const dt = Math.min(clock.getDelta(), 0.05);
    angle += dt * 0.06; // rotation lente 360°
    bgCam.rotation.y = angle;

    lampFlicker -= dt;
    if(lampFlicker <= 0){
      lamps.forEach(l => l.intensity = 1.3 + Math.random()*0.5);
      lampFlicker = 0.15 + Math.random()*0.6;
    }
    bgRenderer.render(bgScene, bgCam);
  }
  animateBg();
})();

(function(){
  // ---------- SETUP ----------
  const canvas = document.getElementById('renderCanvas');
  const INTERNAL_W = 320, INTERNAL_H = 180; // résolution interne basse -> look PS1

  const renderer = new THREE.WebGLRenderer({canvas, antialias:false});
  renderer.setSize(INTERNAL_W, INTERNAL_H, false);
  renderer.setPixelRatio(1);
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, 0.09);

  const camera = new THREE.PerspectiveCamera(70, INTERNAL_W/INTERNAL_H, 0.05, 40);
  camera.position.set(0, 1.6, 5);

  // ---------- PS1 VERTEX JITTER MATERIAL HELPER ----------
  // On simule l'effet d'affine texture-mapping/jitter en snappant les positions de vertex
  // dans le vertex shader (comme la vraie PS1). On patche via onBeforeCompile.
  function ps1ify(material){
    material.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader.replace(
        '#include <project_vertex>',
        `
        vec4 mvPosition = vec4( transformed, 1.0 );
        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;
        gl_Position.xyz = gl_Position.xyz / gl_Position.w * 40.0;
        gl_Position.xyz = floor(gl_Position.xyz) / 40.0;
        gl_Position.w = 1.0;
        `
      );
    };
    return material;
  }

  // ---------- LIGHTING ----------
  const ambient = new THREE.AmbientLight(0x1a1a22, 0.35);
  scene.add(ambient);

  const flashlight = new THREE.SpotLight(0xfff2d0, 1.6, 12, Math.PI/7, 0.5, 1.8);
  flashlight.castShadow = false;
  camera.add(flashlight);
  flashlight.position.set(0,0,0);
  flashlight.target.position.set(0,0,-1);
  camera.add(flashlight.target);
  scene.add(camera);

  // flicker
  let flickerTimer = 0;

  // ---------- MATERIALS ----------
  const floorMat = ps1ify(new THREE.MeshLambertMaterial({color:0x2b2620}));
  const wallMat  = ps1ify(new THREE.MeshLambertMaterial({color:0x3a332c}));
  const ceilMat  = ps1ify(new THREE.MeshLambertMaterial({color:0x14110e}));
  const propMat  = ps1ify(new THREE.MeshLambertMaterial({color:0x4a3f30}));
  const itemMat  = ps1ify(new THREE.MeshLambertMaterial({color:0x8a6a2a, emissive:0x2a1a05}));
  const entityMat= ps1ify(new THREE.MeshLambertMaterial({color:0x050505}));

  // ---------- ROOM BUILDER ----------
  const ROOM_W = 10, ROOM_D = 14, ROOM_H = 3.2;
  const collidables = []; // {min,max} AABB for simple collision

  function addBox(w,h,d,x,y,z,mat,collide=true){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x,y,z);
    scene.add(mesh);
    if(collide){
      collidables.push({
        min:new THREE.Vector3(x-w/2,y-h/2,z-d/2),
        max:new THREE.Vector3(x+w/2,y+h/2,z+d/2)
      });
    }
    return mesh;
  }

  // floor / ceiling
  addBox(ROOM_W,0.2,ROOM_D,0,-0.1,0,floorMat,false);
  addBox(ROOM_W,0.2,ROOM_D,0,ROOM_H,0,ceilMat,false);
  // walls (leave gaps for corridor at z-)
  addBox(0.3,ROOM_H,ROOM_D,-ROOM_W/2,ROOM_H/2,0,wallMat);
  addBox(0.3,ROOM_H,ROOM_D, ROOM_W/2,ROOM_H/2,0,wallMat);
  addBox(ROOM_W,ROOM_H,0.3,0,ROOM_H/2,-ROOM_D/2,wallMat);
  addBox(ROOM_W,ROOM_H,0.3,0,ROOM_H/2, ROOM_D/2,wallMat);

  // clutter props for atmosphere
  addBox(1.2,1.2,0.6, -3.5, 0.6, -5, propMat);
  addBox(0.8,2.0,0.4, 3.5, 1.0, -4, propMat);
  addBox(2.0,0.9,0.9, -2, 0.45, 4, propMat);
  addBox(0.6,1.8,0.6, 4, 0.9, 3, propMat);
  addBox(3.0,0.1,1.2, 0, 0.9, 0, propMat); // table
  addBox(3.0,0.9,0.1, 0, 0.45, -0.6, propMat, false); // table leg visual (rough)

  // ---------- ITEMS (ritual objects) ----------
  const items = [];
  function spawnItem(x,z){
    const geo = new THREE.OctahedronGeometry(0.18,0);
    const mesh = new THREE.Mesh(geo, itemMat);
    mesh.position.set(x, 0.9, z);
    scene.add(mesh);
    items.push(mesh);
  }
  spawnItem(-3.2, -4.6);
  spawnItem(3.3, -3.7);
  spawnItem(-1.6, 4.1);
  spawnItem(1.4, 0.95);

  let itemsFound = 0;
  const itemCountEl = document.getElementById('itemCount');
  const pickupMsg = document.getElementById('pickupMsg');
  const interactPrompt = document.getElementById('interactPrompt');

  // ---------- ENTITY (stalker) ----------
  const entity = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.4,1.9,6),
    entityMat
  );
  entity.position.set(0, 0.95, -6);
  entity.visible = false;
  scene.add(entity);

  let dangerLevel = 0; // rises when player lingers, entity approaches at high danger
  let entityActive = false;
  let entityChasing = false;

  // ---------- CONTROLS ----------
  const keys = {};
  document.addEventListener('keydown', e => keys[e.code]=true);
  document.addEventListener('keyup', e => keys[e.code]=false);

  let yaw = 0, pitch = 0;
  const startScreen = document.getElementById('startScreen');
  startScreen.addEventListener('click', () => {
    canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    if(document.pointerLockElement === canvas){
      startScreen.style.display = 'none';
    }
  });
  document.addEventListener('mousemove', e => {
    if(document.pointerLockElement !== canvas) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
  });

  // ---------- COLLISION ----------
  const PLAYER_RADIUS = 0.35;
  function collides(pos){
    for(const box of collidables){
      if(pos.x + PLAYER_RADIUS > box.min.x && pos.x - PLAYER_RADIUS < box.max.x &&
         pos.z + PLAYER_RADIUS > box.min.z && pos.z - PLAYER_RADIUS < box.max.z &&
         pos.y > box.min.y - 1.6 && pos.y < box.max.y + 0.5){
        return true;
      }
    }
    return false;
  }

  // ---------- INTERACT ----------
  let nearestItem = null;
  document.addEventListener('keydown', e => {
    if(e.code === 'KeyE' && nearestItem){
      scene.remove(nearestItem);
      items.splice(items.indexOf(nearestItem),1);
      itemsFound++;
      itemCountEl.textContent = itemsFound;
      nearestItem = null;
      pickupMsg.textContent = 'Objet rituel récupéré...';
      pickupMsg.style.opacity = 1;
      setTimeout(()=>pickupMsg.style.opacity=0, 1800);
      dangerLevel = Math.min(dangerLevel + 15, 100);
      if(itemsFound >= 4){
        setTimeout(()=>{
          pickupMsg.textContent = "Les 4 objets sont réunis. La porte s'ouvre...";
          pickupMsg.style.opacity = 1;
        }, 2000);
      }
    }
  });

  // ---------- CLOCK / LOOP ----------
  const clock = new THREE.Clock();
  const moveVec = new THREE.Vector3();

  function updatePlayer(dt){
    camera.rotation.set(0,0,0);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const speed = (keys['ShiftLeft'] ? 3.2 : 2.0) * dt;
    moveVec.set(0,0,0);
    if(keys['KeyW']||keys['ArrowUp']) moveVec.z -= 1;
    if(keys['KeyS']||keys['ArrowDown']) moveVec.z += 1;
    if(keys['KeyA']||keys['ArrowLeft']) moveVec.x -= 1;
    if(keys['KeyD']||keys['ArrowRight']) moveVec.x += 1;

    if(moveVec.lengthSq() > 0){
      moveVec.normalize();
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.sin(yaw+Math.PI/2), 0, Math.cos(yaw+Math.PI/2));
      const delta = new THREE.Vector3();
      delta.addScaledVector(forward, -moveVec.z * speed);
      delta.addScaledVector(right, moveVec.x * speed);

      const testPos = camera.position.clone();
      testPos.x += delta.x;
      if(!collides(testPos)) camera.position.x = testPos.x;
      testPos.copy(camera.position);
      testPos.z += delta.z;
      if(!collides(testPos)) camera.position.z = testPos.z;
    }
  }

  function updateNearestItem(){
    let best = null, bestDist = 1.3;
    for(const it of items){
      const d = it.position.distanceTo(camera.position);
      if(d < bestDist){ best = it; bestDist = d; }
    }
    nearestItem = best;
    interactPrompt.style.opacity = nearestItem ? 1 : 0;
  }

  function updateEntity(dt, elapsed){
    // danger rises slowly over time to create tension, entity becomes visible/active late game
    dangerLevel = Math.min(dangerLevel + dt*1.2, 100);

    if(dangerLevel > 55 && !entityActive){
      entityActive = true;
      entity.visible = true;
    }

    if(entityActive){
      if(dangerLevel > 80) entityChasing = true;

      const target = entityChasing ? camera.position : entity.position;
      if(entityChasing){
        const dir = new THREE.Vector3().subVectors(camera.position, entity.position);
        dir.y = 0;
        const dist = dir.length();
        if(dist > 0.01){
          dir.normalize();
          entity.position.addScaledVector(dir, dt * 1.4);
        }
      } else {
        // subtle idle sway to feel "alive" in peripheral vision
        entity.position.x = -1 + Math.sin(elapsed*0.3)*0.5;
        entity.position.z = -6 + Math.cos(elapsed*0.2)*0.5;
      }
      entity.lookAt(camera.position.x, entity.position.y, camera.position.z);
    }
  }

  function updateFlicker(dt){
    flickerTimer -= dt;
    if(flickerTimer <= 0){
      flashlight.intensity = 1.2 + Math.random()*0.6;
      flickerTimer = 0.05 + Math.random()*0.4;
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    if(document.pointerLockElement === canvas){
      updatePlayer(dt);
      updateNearestItem();
      updateEntity(dt, elapsed);
    }
    updateFlicker(dt);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
  });
})();
</script>
</body>
</html>
