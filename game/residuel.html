<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RÉSIDUEL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;height:100%;width:100%;}
  #startScreen{
    position:fixed;inset:0;background:#000;color:#999;display:flex;
    align-items:center;justify-content:center;
    text-align:center;overflow:hidden;z-index:10;
  }
  #bgVideo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(0.85) contrast(1.05) brightness(0.8);
  }
  #startOverlay{
    position:relative;z-index:2;background:radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.6) 100%);
    width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;box-sizing:border-box;
  }
  #startScreen h1{
    font-family:'Press Start 2P',monospace;
    font-size:38px;letter-spacing:4px;line-height:1.5;margin:0 0 46px 0;
    color:#cfcac0;
    text-shadow:
      3px 3px 0 #000,
      0 0 18px rgba(0,0,0,0.9);
  }
  #startScreen h1 .gold{
    color:#e8c565;
    text-shadow:3px 3px 0 #000, 0 0 12px rgba(232,197,101,0.6), 0 0 22px rgba(0,0,0,0.9);
  }
  #menuButtons{
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .pixelBtn{
    font-family:'Press Start 2P',monospace;
    font-size:14px;letter-spacing:2px;
    color:#d8d2c6;background:#14110d;
    padding:14px 34px;
    border:4px solid #3a3226;
    box-shadow:0 0 0 2px #0a0806;
    cursor:pointer;
    transition:transform 0.08s ease, color 0.15s, border-color 0.15s;
    min-width:220px;
  }
  .pixelBtn:hover{
    color:#e8c565;border-color:#e8c565;
    box-shadow:0 0 0 2px #0a0806, 0 0 12px rgba(232,197,101,0.35);
    transform:translateY(-2px);
  }
  .pixelBtn:active{transform:translateY(1px);}
  #wikimindLogo{
    position:absolute;top:24px;left:50%;transform:translateX(-50%);
    width:64px;height:auto;z-index:3;
    filter:drop-shadow(0 0 6px rgba(0,0,0,0.9));
    pointer-events:none;
  }
  #startScreen .signature{
    position:absolute;bottom:16px;right:20px;font-size:11px;color:#555;
    letter-spacing:2px;text-shadow:0 0 6px #000;z-index:3;
  }
  #settingsMsg{
    position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);
    color:#d0c0a0;font-size:12px;letter-spacing:1px;opacity:0;
    transition:opacity 0.3s;z-index:3;pointer-events:none;
  }

  /* ---------- GAME ---------- */
  #gameContainer{
    position:fixed;inset:0;background:#000;display:none;z-index:5;
  }
  #gameCanvas{
    width:100%;height:100%;display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  #fadeLayer{
    position:fixed;inset:0;background:#000;z-index:20;
    opacity:0;pointer-events:none;transition:opacity 1.1s ease;
  }
  #fadeLayer.on{opacity:1;pointer-events:all;}

  #dialogueBox{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:min(720px,86%);
    background:rgba(8,8,8,0.82);
    border:3px solid #3a3226;
    box-shadow:0 0 0 2px #0a0806, 0 0 18px rgba(0,0,0,0.7);
    color:#e6e0d2;
    padding:16px 20px;
    font-family:'Courier New',monospace;
    font-size:16px;line-height:1.5;
    z-index:8;
    opacity:0;transition:opacity 0.25s;
    pointer-events:none;
  }
  #dialogueBox.show{opacity:1;pointer-events:all;cursor:pointer;}
  #dialogueName{
    font-family:'Press Start 2P',monospace;
    font-size:11px;color:#e8c565;margin-bottom:8px;letter-spacing:1px;
  }
  #dialogueHint{
    position:absolute;bottom:8px;right:14px;font-size:10px;color:#7a7566;
    letter-spacing:1px;
  }

  #torchOverlay{
    position:absolute;right:2%;bottom:0;
    width:260px;height:260px;
    z-index:9;pointer-events:none;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 10px rgba(255,210,120,0.25));
    opacity:0;transition:opacity 0.6s;
  }
  #torchOverlay.show{opacity:1;}

  #crosshair{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:6px;height:6px;background:rgba(230,210,150,0.5);
    border-radius:50%;z-index:7;pointer-events:none;opacity:0;
  }
  #crosshair.show{opacity:1;}

  #introTip{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:1px;color:#9a9384;
    background:rgba(0,0,0,0.5);padding:6px 14px;border:1px solid #2c271e;
    z-index:8;opacity:0;transition:opacity 0.5s;pointer-events:none;
  }
  #introTip.show{opacity:1;}
</style>
</head>
<body>
<div id="startScreen">
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="vid.mp4" type="video/mp4">
  </video>
  <img id="wikimindLogo" src="../wikimind.png" alt="Wikimind">
  <div id="startOverlay">
    <h1>RÉSID<span class="gold">U</span>EL</h1>
    <div id="menuButtons">
      <button class="pixelBtn" id="btnPlay">JOUER</button>
      <button class="pixelBtn" id="btnSettings">PARAMÈTRES</button>
    </div>
  </div>
  <div class="signature">by Wikimind</div>
  <div id="settingsMsg"></div>
</div>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueHint">clique / espace ▸</div>
  </div>
  <canvas id="torchOverlay"></canvas>
  <div id="crosshair"></div>
  <div id="introTip">ZQSD / WASD — souris pour regarder</div>
</div>

<div id="fadeLayer"></div>

<script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
<script>
/* ================= MENU ================= */
document.getElementById('btnSettings').addEventListener('click', () => {
  const msg = document.getElementById('settingsMsg');
  msg.textContent = 'Paramètres — bientôt disponible';
  msg.style.opacity = 1;
  setTimeout(() => msg.style.opacity = 0, 1600);
});

const fadeLayer = document.getElementById('fadeLayer');
function fadeOut(duration){
  return new Promise(res=>{
    fadeLayer.style.transition = `opacity ${duration}ms ease`;
    fadeLayer.classList.add('on');
    setTimeout(res, duration);
  });
}
function fadeIn(duration){
  return new Promise(res=>{
    fadeLayer.style.transition = `opacity ${duration}ms ease`;
    fadeLayer.classList.remove('on');
    setTimeout(res, duration);
  });
}

document.getElementById('btnPlay').addEventListener('click', async () => {
  await fadeOut(900);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'block';
  initGame();
  await fadeIn(1300);
  startTaxiDialogue();
});

const torchCanvas = document.getElementById('torchOverlay');
const tctx = torchCanvas.getContext('2d');
tctx.imageSmoothingEnabled = false;
function drawTorchOverlay(){
  torchCanvas.width = 260; torchCanvas.height = 260;
  const small = document.createElement('canvas');
  small.width = 40; small.height = 40;
  const sctx = small.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  sctx.save();
  sctx.translate(20,20);
  sctx.rotate(0.55);
  sctx.drawImage(torchImg, -26, -14, 52, 28);
  sctx.restore();
  tctx.imageSmoothingEnabled = false;
  tctx.clearRect(0,0,260,260);
  tctx.drawImage(small, 0,0,40,40, 40,60,220,220);
}
torchImg.onload = drawTorchOverlay;

/* ================= THREE.JS GAME ================= */
let renderer, scene, camera, clock;
let mode = 'taxi';
let flashlight, flashTarget;
let buildings = [];
let streetlights = [];
let taxiGroup, driverGroup;
let keys = {};
let yaw = 0, pitch = 0;
let playerRig;
let pointerLocked = false;

function initGame(){
  const canvas = document.getElementById('gameCanvas');
  renderer = new THREE.WebGLRenderer({canvas, antialias:false});
  const scaleDown = 0.28;
  function resize(){
    const w = Math.max(160, Math.floor(window.innerWidth*scaleDown));
    const h = Math.max(90, Math.floor(window.innerHeight*scaleDown));
    renderer.setSize(w, h, false);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  }

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);
  scene.fog = new THREE.FogExp2(0x05070c, 0.045);

  camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.05, 120);
  window.addEventListener('resize', resize);

  clock = new THREE.Clock();

  buildTaxiScene();

  scene.add(new THREE.AmbientLight(0x28304a, 0.55));
  const moon = new THREE.DirectionalLight(0x7d8bb0, 0.35);
  moon.position.set(-10, 20, -8);
  scene.add(moon);

  resize();
  animate();
}

function makeStreetlight(x,z){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06,0.06,3.2,6),
    new THREE.MeshStandardMaterial({color:0x111318})
  );
  pole.position.y = 1.6;
  g.add(pole);
  const lampGeo = new THREE.SphereGeometry(0.18,8,8);
  const lampMat = new THREE.MeshStandardMaterial({color:0xffdd88, emissive:0xffcc66, emissiveIntensity:1.4});
  const lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.y = 3.15;
  g.add(lamp);
  const light = new THREE.PointLight(0xffcc77, 1.1, 6, 2);
  light.position.y = 3.1;
  g.add(light);
  g.position.set(x,0,z);
  scene.add(g);
  streetlights.push(g);
}

function makeBuilding(x,z,w,h,d,colorSeed){
  const colors = [0x14181f,0x181c24,0x0f1218,0x1b1f27];
  const mat = new THREE.MeshStandardMaterial({color: colors[colorSeed%colors.length], roughness:0.9});
  const geo = new THREE.BoxGeometry(w,h,d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z);
  scene.add(mesh);
  const winMat = new THREE.MeshBasicMaterial({color:0xffe9a8});
  for(let i=0;i<Math.floor(h/1.4);i++){
    if(Math.random()>0.55) continue;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.7), winMat);
    win.position.set(x + w/2 + 0.01, 1 + i*1.4, z + (Math.random()-0.5)*d*0.6);
    win.rotation.y = -Math.PI/2;
    scene.add(win);
    buildings.push(win);
  }
  buildings.push(mesh);
  return mesh;
}

function buildTaxiScene(){
  mode = 'taxi';
  const road = new THREE.Mesh(new THREE.PlaneGeometry(14,400), new THREE.MeshStandardMaterial({color:0x0d0d10}));
  road.rotation.x = -Math.PI/2;
  road.position.z = -150;
  scene.add(road);

  for(let i=0;i<40;i++){
    const z = -i*10 - 5;
    makeBuilding(-9 - Math.random()*3, z, 5+Math.random()*3, 4+Math.random()*8, 6, i);
    makeBuilding(9 + Math.random()*3, z, 5+Math.random()*3, 4+Math.random()*8, 6, i+1);
    if(i%2===0){
      makeStreetlight(-6, z);
      makeStreetlight(6, z-5);
    }
  }

  taxiGroup = new THREE.Group();
  const dashMat = new THREE.MeshStandardMaterial({color:0x0b0b0d});
  const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.6), dashMat);
  dash.position.set(0, -0.35, -1.0);
  taxiGroup.add(dash);

  const wheelMat = new THREE.MeshStandardMaterial({color:0x151515});
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,8,16), wheelMat);
  wheel.position.set(-0.35,-0.05,-1.15);
  taxiGroup.add(wheel);

  driverGroup = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({color:0x2a2f3a});
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.55,4,8), bodyMat);
  body.position.set(-0.55,0.1,-1.35);
  driverGroup.add(body);
  const headMat = new THREE.MeshStandardMaterial({color:0xc9a583});
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), headMat);
  head.position.set(-0.55,0.55,-1.35);
  driverGroup.add(head);
  taxiGroup.add(driverGroup);

  const frameMat = new THREE.MeshStandardMaterial({color:0x08080a});
  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.15,2.2), frameMat);
  frameTop.position.set(0,1.05,-0.7);
  taxiGroup.add(frameTop);

  scene.add(taxiGroup);
  taxiGroup.position.set(0,0.6,0);

  camera.position.set(0.35, 0.95, 0.4);
  camera.rotation.set(0,0,0);
  camera.lookAt(0,0.7,-1.2);
}

let taxiSpeed = 6;
function updateTaxiRide(dt){
  buildings.forEach(b=>{ b.position.z += dt*taxiSpeed; });
  streetlights.forEach(g=>{ g.position.z += dt*taxiSpeed; });
  taxiGroup.position.y = 0.6 + Math.sin(clock.elapsedTime*3)*0.01;
  camera.position.y = 0.95 + Math.sin(clock.elapsedTime*3)*0.01;
}

/* ---------- Dialogue ---------- */
const dialogueBox = document.getElementById('dialogueBox');
const dialogueName = document.getElementById('dialogueName');
const dialogueText = document.getElementById('dialogueText');
let dialogueQueue = [];
let dialogueActive = false;
let onDialogueEnd = null;

const taxiLines = [
  ["CHAUFFEUR","Alors, on va où ce soir?"],
  ["MOI","Au musée de la ville, s'il vous plaît."],
  ["CHAUFFEUR","Le musée, hein... C'est calme là-bas cette semaine."],
  ["MOI","C'est mon premier jour. Mon premier vrai boulot."],
  ["CHAUFFEUR","Ah, félicitations. Gardien de nuit?"],
  ["MOI","Oui. Un peu stressant, je dois avouer."],
  ["CHAUFFEUR","Ça va aller. Les vieux bâtiments comme ça... ils ont juste besoin qu'on s'habitue à eux."],
  ["CHAUFFEUR","On arrive dans deux minutes."]
];

function showDialogueLine(){
  if(dialogueQueue.length===0){
    dialogueBox.classList.remove('show');
    dialogueActive = false;
    if(onDialogueEnd) { const cb = onDialogueEnd; onDialogueEnd=null; cb(); }
    return;
  }
  const [name, text] = dialogueQueue.shift();
  dialogueName.textContent = name;
  dialogueText.textContent = text;
  dialogueBox.classList.add('show');
  dialogueActive = true;
}

function advanceDialogue(){
  if(!dialogueActive) return;
  showDialogueLine();
}
dialogueBox.addEventListener('click', advanceDialogue);
window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='Space' && dialogueActive){ advanceDialogue(); e.preventDefault(); }
});
window.addEventListener('keyup', e=> keys[e.code] = false);

function startTaxiDialogue(){
  dialogueQueue = taxiLines.slice();
  onDialogueEnd = arriveAtMuseum;
  showDialogueLine();
}

async function arriveAtMuseum(){
  taxiSpeed = 0;
  await new Promise(r=>setTimeout(r, 700));
  await fadeOut(1000);
  buildExteriorScene();
  await fadeIn(1300);
  document.getElementById('introTip').classList.add('show');
  document.getElementById('torchOverlay').classList.add('show');
  document.getElementById('crosshair').classList.add('show');
  setTimeout(()=> document.getElementById('introTip').classList.remove('show'), 4500);
  requestPointerLock();
}

/* ---------- Exterior / museum / free-roam ---------- */
function buildExteriorScene(){
  mode = 'exterior';
  while(scene.children.length){ scene.remove(scene.children[0]); }
  buildings = []; streetlights = [];
  scene.fog = new THREE.FogExp2(0x030407, 0.06);

  scene.add(new THREE.AmbientLight(0x26304a, 0.5));
  const moon = new THREE.DirectionalLight(0x7d8bb0, 0.3);
  moon.position.set(-10,20,-8);
  scene.add(moon);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x0c0c0e}));
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  const museumMat = new THREE.MeshStandardMaterial({color:0x1a1a1c, roughness:0.85});
  const museum = new THREE.Mesh(new THREE.BoxGeometry(16,7,6), museumMat);
  museum.position.set(0,3.5,-10);
  scene.add(museum);

  for(let i=-6;i<=6;i+=3){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,6.6,10), new THREE.MeshStandardMaterial({color:0xc9c3b5}));
    col.position.set(i,3.3,-7.2);
    scene.add(col);
  }
  for(let s=0;s<3;s++){
    const step = new THREE.Mesh(new THREE.BoxGeometry(12-s*0.5,0.25,1-s*0.1), new THREE.MeshStandardMaterial({color:0x232323}));
    step.position.set(0, 0.12+s*0.25, -6+s*0.5);
    scene.add(step);
  }
  const signMat = new THREE.MeshBasicMaterial({color:0xf2e3b0});
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6,0.8), signMat);
  sign.position.set(0,6.4,-6.95);
  scene.add(sign);

  for(let i=0;i<10;i++){
    const z = -2 + i*3;
    makeBuilding(-13, z, 4+Math.random()*2, 5+Math.random()*10, 6, i);
    makeBuilding(13, z, 4+Math.random()*2, 5+Math.random()*10, 6, i+1);
  }
  makeStreetlight(-4,-2); makeStreetlight(4,-2);
  makeStreetlight(-8,4); makeStreetlight(8,4);

  const taxiBody = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.9,3.6), new THREE.MeshStandardMaterial({color:0xf0c419}));
  taxiBody.position.set(3,0.6,2);
  scene.add(taxiBody);
  window._departingTaxi = taxiBody;

  flashlight = new THREE.SpotLight(0xfff2c8, 3.2, 14, Math.PI/7, 0.5, 1.2);
  flashlight.position.set(0,0,0);
  flashTarget = new THREE.Object3D();
  scene.add(flashlight, flashTarget);
  flashlight.target = flashTarget;
  camera.add(flashlight);
  camera.add(flashTarget);
  flashTarget.position.set(0,0,-1);
  scene.add(camera);

  playerRig = { x:0, y:1.6, z:2 };
  camera.position.set(playerRig.x, playerRig.y, playerRig.z);
  yaw = Math.PI; pitch = 0;
}

function requestPointerLock(){
  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('click', ()=>{
    if(mode==='exterior') canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', ()=>{
    pointerLocked = document.pointerLockElement === canvas;
  });
  document.addEventListener('mousemove', e=>{
    if(!pointerLocked || mode!=='exterior') return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
  });
}

function updateExteriorMovement(dt){
  const speed = 3.2 * dt;
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw+Math.PI/2), 0, Math.cos(yaw+Math.PI/2));
  let mv = new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp']) mv.add(forward);
  if(keys['KeyS']||keys['ArrowDown']) mv.sub(forward);
  if(keys['KeyD']||keys['ArrowRight']) mv.add(right);
  if(keys['KeyA']||keys['ArrowLeft']) mv.sub(right);
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(speed); playerRig.x += mv.x; playerRig.z += mv.z; }

  const bob = Math.sin(clock.elapsedTime*8) * (mv.lengthSq()>0 ? 0.02 : 0);
  camera.position.set(playerRig.x, playerRig.y+bob, playerRig.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  if(window._departingTaxi){
    window._departingTaxi.position.z -= dt*4;
    window._departingTaxi.position.x -= dt*1.2;
    if(window._departingTaxi.position.z < -60){ scene.remove(window._departingTaxi); window._departingTaxi=null; }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(mode==='taxi') updateTaxiRide(dt);
  if(mode==='exterior' && !dialogueActive) updateExteriorMovement(dt);
  renderer.render(scene, camera);
}
</script>
